name: Docs canary

# Weekly check that fmod.com's API reference still matches the snapshot
# the browser extension was built against. The Haxe tab is keyed by
# function heading ids and by the position of code examples on each
# page, so a page edit on their side can leave a tab on the wrong
# example or drop one. A red run here means fmod.com changed and the
# extension data needs a look, see extension/README.md.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  site-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install playwright > /dev/null
          npx playwright install --with-deps chromium

      - name: Compare fmod.com with the snapshot
        run: node extension/test/crawl-site.js --check

  notify-failure:
    runs-on: ubuntu-latest
    needs: [site-snapshot]
    if: ${{ !cancelled() && needs.site-snapshot.result == 'failure' }}
    timeout-minutes: 5
    steps:
      - name: Send failure email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.CANARY_ALERT_TO }}
          ALERT_FROM: ${{ vars.CANARY_ALERT_FROM || 'onboarding@resend.dev' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY secret is not set - skipping email alert"
            exit 0
          fi
          if [ -z "$ALERT_TO" ]; then
            echo "CANARY_ALERT_TO repository variable is not set - skipping email alert"
            exit 0
          fi
          SUBJECT="haxe-fmod docs canary: fmod.com changed"
          TEXT="The fmod.com API reference no longer matches extension/test/site-snapshot.json.

          The run log lists every added, removed, or moved function and example:
          $RUN_URL

          Check extension/examples and extension/functions.md, then refresh the snapshot with:
            node extension/test/crawl-site.js --update"
          PAYLOAD=$(jq -n --arg from "$ALERT_FROM" --arg to "$ALERT_TO" --arg subject "$SUBJECT" --arg text "$TEXT" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
