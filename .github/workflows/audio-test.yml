name: Build and Audio Test

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ contains(github.event.head_commit.message, '[skip-build]') }}
  cancel-in-progress: true

# Solo-build: include [job-name] in commit message to run only that job
# e.g. "[linux-html5]" runs only the linux-html5 job
# [skip-build] skips all jobs
# Tag pushes always run the full suite and never run update-hdlls

env:
  HAXE_VERSION: 4.3.6
  FMOD_SDK: ${{ github.workspace }}/fmod-sdk

jobs:
  # ===========================================================================
  # Unit Tests (pure Haxe, no FMOD SDK needed)
  # ===========================================================================
  unit-tests:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[skip-build]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Run unit tests
        run: haxe tests/build.hxml

      - name: Constants generator parity (CLI vs FMOD Studio script)
        run: |
          haxe -cp . --run haxefmod.tools.Generate \
            --strings tests/fixtures/Master.strings.bank --out /tmp/gen-cli
          node tests/js/constants-parity.js /tmp/gen-cli
          # The generated output must also compile
          haxe -cp /tmp/gen-cli --no-output FmodEvents FmodBuses FmodParameters FmodEventEnum

      - name: Todo scanner end to end
        run: |
          # The example project carries one real marker. The scanner must
          # find exactly it and nothing else (doc comments and usage
          # strings mentioning the call must not count).
          haxe -cp . --run haxefmod.tools.Todos example-project > /tmp/todos.out
          cat /tmp/todos.out
          grep -q "PlayState.hx:.*ambient wind loop behind the music" /tmp/todos.out
          grep -q "1 sound TODO(s) remaining." /tmp/todos.out
          # The facade must type-check with the placeholder beep enabled
          haxe -cp . --no-output -js /tmp/todo-typing.js -D haxefmod_todo_beep --debug haxefmod.FmodManager

      - name: Verify native shims match the FFI manifest
        run: haxe -cp . --run haxefmod.tools.NativeManifestCheck

      - name: Test native handle table (C99 and C++ modes)
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -o /tmp/test_handles_c tests/native/test_faxe_handles.c
          /tmp/test_handles_c
          g++ -x c++ -Wall -Wextra -Werror -o /tmp/test_handles_cpp tests/native/test_faxe_handles.c
          /tmp/test_handles_cpp

      - name: Test native callback queue (C99 and C++ modes)
        run: |
          gcc -std=c99 -pthread -Wall -Wextra -Werror -o /tmp/test_cbq_c tests/native/test_faxe_cbqueue.c
          /tmp/test_cbq_c
          g++ -x c++ -pthread -Wall -Wextra -Werror -o /tmp/test_cbq_cpp tests/native/test_faxe_cbqueue.c
          /tmp/test_cbq_cpp

      - name: Test native GUID helpers (C99 and C++ modes)
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -o /tmp/test_guid_c tests/native/test_faxe_guid.c
          /tmp/test_guid_c
          g++ -x c++ -Wall -Wextra -Werror -o /tmp/test_guid_cpp tests/native/test_faxe_guid.c
          /tmp/test_guid_cpp

      - name: Negative-test the synth frequency gate
        run: python3 ci/synth-gate-selftest.py

      - name: Check workflow gating invariants
        run: python3 ci/workflow-invariants.py

      - name: Check FMOD version literal lockstep
        run: python3 ci/version-lockstep.py

      - name: Check hxcpp depend lockstep
        run: python3 ci/depend-lockstep.py

      - name: Compile the README examples
        run: python3 ci/check-readme-snippets.py

      - name: Test native PCM ring buffer (C99 and C++ modes)
        run: |
          gcc -std=c99 -pthread -Wall -Wextra -Werror -o /tmp/test_pcmring_c tests/native/test_faxe_pcmring.c
          /tmp/test_pcmring_c
          g++ -x c++ -pthread -Wall -Wextra -Werror -o /tmp/test_pcmring_cpp tests/native/test_faxe_pcmring.c
          /tmp/test_pcmring_cpp

      - name: Check binding coverage against the manifest
        run: python3 ci/binding-coverage.py

      # The main suite only ever runs the define fallbacks: these two
      # variants prove -D haxefmod_* values and the -debug defaults
      # actually reach the settings resolver
      - name: Test define-driven settings (haxefmod_* and -debug)
        run: |
          haxe tests/build-defines.hxml
          haxe tests/build-debug-defaults.hxml

      # The shared headers own the cross-thread lifetime contracts.
      # ASan/UBSan cover the single-threaded invariants (including the
      # handle fuzz), TSan proves the locking on the two tests that drive
      # a real producer thread.
      - name: Run native tests under AddressSanitizer and UBSan
        run: |
          for t in handles cbqueue guid pcmring; do
            gcc -std=c99 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Wall -Wextra -Werror -o /tmp/asan_$t tests/native/test_faxe_$t.c
            /tmp/asan_$t
          done

      - name: Run threaded native tests under ThreadSanitizer
        run: |
          for t in cbqueue pcmring; do
            gcc -std=c99 -pthread -fsanitize=thread -Wall -Wextra -Werror \
              -o /tmp/tsan_$t tests/native/test_faxe_$t.c
            /tmp/tsan_$t
          done

  # ===========================================================================
  # API docs (dox) - rendered from the haxefmod package, uploaded as artifact
  # ===========================================================================
  api-docs:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[skip-build]') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-docs-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install dox
        run: |
          haxelib setup ~/haxelib
          haxelib install dox --always --quiet

      - name: Generate type XML
        run: |
          # haxefmod.flixel is ignored: the flixel components only type-check
          # against an installed flixel, and the API docs cover the core
          # library surface
          mkdir -p /tmp/haxefmod-docs
          haxe -cp . --no-output -D doc-gen \
            --macro "include('haxefmod', true, ['haxefmod.flixel'])" \
            -xml /tmp/haxefmod-docs/haxefmod-docs.xml --interp

      - name: Render API docs
        run: haxelib run dox -i /tmp/haxefmod-docs -o /tmp/haxefmod-api-docs -in haxefmod

      - name: Upload API docs
        uses: actions/upload-artifact@v6
        with:
          name: haxefmod-api-docs
          path: /tmp/haxefmod-api-docs

  # ===========================================================================
  # Linux C++ Build + Audio Recording
  # ===========================================================================
  linux-cpp:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[linux-cpp]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: linux
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib install hxcpp 4.3.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg patchelf libgl1-mesa-dev

      - name: Cache hxcpp objects
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ runner.os }}-

      - name: Build C++ target
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build linux -64

      - name: Patch FMOD libraries
        run: |
          BIN_DIR="example-project/EZPlatformer/export/linux64/bin"
          if [ ! -d "$BIN_DIR" ]; then
            BIN_DIR="example-project/EZPlatformer/export/linux/bin"
          fi
          patchelf --clear-execstack "$BIN_DIR"/libfmod.so* || true
          patchelf --clear-execstack "$BIN_DIR"/libfmodstudio.so* || true

      - name: Validate build output
        run: |
          BIN_DIR="example-project/EZPlatformer/export/linux64/bin"
          if [ ! -d "$BIN_DIR" ]; then
            BIN_DIR="example-project/EZPlatformer/export/linux/bin"
          fi
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" cpp

      - name: Record audio
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1

          # Start PulseAudio with virtual sink
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker

          # Configure ALSA to route through PulseAudio (FMOD uses ALSA by default)
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF

          # Find the bin directory
          BIN_DIR="example-project/EZPlatformer/export/linux64/bin"
          if [ ! -d "$BIN_DIR" ]; then
            BIN_DIR="example-project/EZPlatformer/export/linux/bin"
          fi

          # Start recording from the virtual sink's monitor
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-linux-cpp.wav &
          RECORD_PID=$!

          # Run the game
          cd "$BIN_DIR"
          chmod +x run.sh
          timeout 30 ./run.sh > /tmp/game-linux-cpp.log 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat /tmp/game-linux-cpp.log || true
          echo "=== End game log ==="

          # Wait for recording to finish
          wait $RECORD_PID || true

          if [ -f /tmp/audio-linux-cpp.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-linux-cpp.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-linux-cpp.wav 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh /tmp/game-linux-cpp.log

      - name: Build volume test
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean linux
          haxelib run lime build linux -64 -Daudio_test

      - name: Record volume test
        run: |
          export DISPLAY=:99

          BIN_DIR="example-project/EZPlatformer/export/linux64/bin"
          if [ ! -d "$BIN_DIR" ]; then
            BIN_DIR="example-project/EZPlatformer/export/linux/bin"
          fi

          export FMOD_WAVWRITER=/tmp/volume-test-linux-cpp.wav

          cd "$BIN_DIR"
          chmod +x run.sh
          ./run.sh > /tmp/volume-test-linux-cpp.log 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh /tmp/volume-test-linux-cpp.wav 15

      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/linux*/bin
          log-file: /tmp/api-probe-linux-cpp.log

      - name: Run synth-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: synth-test
          gate: SYNTH_TEST
          bin-dir: example-project/EZPlatformer/export/linux*/bin
          log-file: /tmp/synth-test-linux-cpp.log
          use-wavwriter: "true"
          timeout: "60"

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run cb-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: cb-test
          gate: CB_TEST
          bin-dir: example-project/EZPlatformer/export/linux*/bin
          log-file: /tmp/cb-test-linux-cpp.log
          extra-gate: "CB_TEST: Stopped"

      - name: Run ps-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: ps-test
          gate: PS_TEST
          bin-dir: example-project/EZPlatformer/export/linux*/bin
          log-file: /tmp/ps-test-linux-cpp.log
          copy-jump-wav: "true"

      - name: Run bank-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: bank-test
          gate: BANK_TEST
          bin-dir: example-project/EZPlatformer/export/linux*/bin
          log-file: /tmp/bank-test-linux-cpp.log

      - name: Run pan-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: pan-test
          gate: PAN_TEST
          bin-dir: example-project/EZPlatformer/export/linux*/bin
          log-file: /tmp/pan-test-linux-cpp.log

      # The define-driven build variant: -D haxefmod_* overrides plus
      # autoUpdate:false, so the full probe suite runs on FmodManager's
      # manual sys_update pushes instead of the auto-update thread. The
      # probe asserts both settings landed (hardening_manual_update /
      # hardening_define_channels checks).
      - name: Build manual-update variant
        if: ${{ !cancelled() }}
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build linux -64 -Daudio_test -Daudio_test_manual_update -Dhaxefmod_num_channels=100

      - name: Run api-probe state (manual update variant)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/linux*/bin
          log-file: /tmp/api-probe-linux-cpp-manual.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-linux-cpp
          path: |
            /tmp/audio-linux-cpp.wav
            /tmp/game-linux-cpp.log
            /tmp/volume-test-linux-cpp.wav
            /tmp/api-probe-linux-cpp.log
            /tmp/cb-test-linux-cpp.log
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # Linux HashLink Build + Audio Recording
  # ===========================================================================
  linux-hl:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[linux-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: linux
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg patchelf \
            libpng-dev libturbojpeg0-dev libsdl2-dev libgl1-mesa-dev \
            libopenal-dev libmbedtls-dev libuv1-dev libvorbis-dev libsqlite3-dev libz-dev

      - name: Build and install HashLink
        run: |
          # Pinned to the commit before the SDL3 port (hashlink #830, 2026-06-17).
          # ubuntu-latest has no libsdl3-dev, so newer hashlink master does not build.
          git clone https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink-src
          cd /tmp/hashlink-src
          git checkout 781960a5daca32ad6d5cea87b255fe8b5872551e
          make -j$(nproc) 2>&1 | tee /tmp/hashlink-build.log || {
            echo "=== MAKE FAILED - retrying single-threaded ==="
            make 2>&1 | tee -a /tmp/hashlink-build.log
            exit 1
          }
          sudo make install
          sudo ldconfig
          hl --version || echo "HashLink installed"

      - name: Verify environment
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod check || true

      - name: Build HashLink target (pre-built hdll)
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-prebuilt.log
          grep -q "(pre-built)" /tmp/build-prebuilt.log
          echo "Verified: pre-built hdll was used"

      - name: Build custom hdll via build-hdll
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod build-hdll
          echo "=== .haxefmod/ contents ==="
          ls -la .haxefmod/
          cat .haxefmod/hlaxe_fmod.version

      - name: Rebuild HashLink target (custom hdll)
        run: |
          rm -rf example-project/EZPlatformer/export/hl
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-custom.log
          grep -q "(custom-compiled from .haxefmod/)" /tmp/build-custom.log
          echo "Verified: custom-compiled hdll from .haxefmod/ was used"

      - name: Upload compiled hdll
        uses: actions/upload-artifact@v6
        with:
          name: hlaxe_fmod-linux.hdll
          path: example-project/EZPlatformer/.haxefmod/hlaxe_fmod.hdll
          overwrite: true

      - name: Patch FMOD libraries
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          patchelf --clear-execstack "$BIN_DIR"/libfmod.so* || true
          patchelf --clear-execstack "$BIN_DIR"/libfmodstudio.so* || true

      - name: Debug bin directory contents
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          echo "=== Files in $BIN_DIR ==="
          ls -la "$BIN_DIR" | grep -E "\.so|\.hdll|EZPlatformer"
          echo ""
          echo "=== hdll dependencies ==="
          ldd "$BIN_DIR"/hlaxe_fmod.hdll || true
          echo ""
          echo "=== FMOD library symlinks ==="
          ls -la "$BIN_DIR"/libfmod* || true

      - name: Validate build output
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" hl

      - name: Record audio
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1

          # Start PulseAudio with virtual sink
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker

          # Configure ALSA to route through PulseAudio (FMOD uses ALSA by default)
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF

          BIN_DIR="example-project/EZPlatformer/export/hl/bin"

          # Start recording from the virtual sink's monitor
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-linux-hl.wav &
          RECORD_PID=$!

          # Run the game with library paths set
          cd "$BIN_DIR"
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          EXE=$(find . -maxdepth 1 -type f -executable ! -name "*.so*" ! -name "*.hdll" ! -name "run.sh" -print -quit)
          chmod +x "$EXE"
          timeout 30 "$EXE" > /tmp/game-linux-hl.log 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat /tmp/game-linux-hl.log || true
          echo "=== End game log ==="

          wait $RECORD_PID || true

          if [ -f /tmp/audio-linux-hl.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-linux-hl.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-linux-hl.wav 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh /tmp/game-linux-hl.log

      - name: Build volume test
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean hl
          haxelib run lime build hl -Daudio_test

      - name: Record volume test
        run: |
          export DISPLAY=:99

          BIN_DIR="example-project/EZPlatformer/export/hl/bin"

          export FMOD_WAVWRITER=/tmp/volume-test-linux-hl.wav

          cd "$BIN_DIR"
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          EXE=$(find . -maxdepth 1 -type f -executable ! -name "*.so*" ! -name "*.hdll" ! -name "run.sh" -print -quit)
          chmod +x "$EXE"
          "$EXE" > /tmp/volume-test-linux-hl.log 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          echo "=== Volume test game log ==="
          cat /tmp/volume-test-linux-hl.log || true
          echo "=== End volume test game log ==="

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh /tmp/volume-test-linux-hl.wav 15

      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: /tmp/api-probe-linux-hl.log

      - name: Run synth-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: synth-test
          gate: SYNTH_TEST
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: /tmp/synth-test-linux-hl.log
          use-wavwriter: "true"
          timeout: "60"

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run cb-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: cb-test
          gate: CB_TEST
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: /tmp/cb-test-linux-hl.log
          extra-gate: "CB_TEST: Stopped"

      - name: Run ps-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: ps-test
          gate: PS_TEST
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: /tmp/ps-test-linux-hl.log
          copy-jump-wav: "true"

      - name: Run bank-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: bank-test
          gate: BANK_TEST
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: /tmp/bank-test-linux-hl.log

      - name: Run pan-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: pan-test
          gate: PAN_TEST
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: /tmp/pan-test-linux-hl.log

      # Short smoke of the stress state so the weekly stress-test workflow
      # cannot rot unnoticed. The full soak runs on its own schedule
      - name: Run stress-test state (smoke)
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99

          BIN_DIR="example-project/EZPlatformer/export/hl/bin"

          export HAXEFMOD_TEST_STATE=stress-test
          export STRESS_SECONDS=15
          cd "$BIN_DIR"
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          EXE=$(find . -maxdepth 1 -type f -executable ! -name "*.so*" ! -name "*.hdll" ! -name "*.sh" ! -name "*.dat" -print -quit)
          "$EXE" > /tmp/stress-smoke-linux-hl.log 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 90); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          grep "STRESS_TEST:" /tmp/stress-smoke-linux-hl.log || true
          if ! grep -q "STRESS_TEST: COMPLETE" /tmp/stress-smoke-linux-hl.log; then
            echo "Stress smoke never completed - full log:"
            cat /tmp/stress-smoke-linux-hl.log
            exit 1
          fi
          if grep -q "pass=false" /tmp/stress-smoke-linux-hl.log; then
            echo "Stress smoke reported failing checks"
            exit 1
          fi
          echo "Stress smoke passed"

      # Runs the literal command users type. The other steps wrap builds
      # in CI plumbing, and this one proves a plain lime test works.
      - name: lime test end to end
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99
          cd example-project/EZPlatformer
          # -Daudio_test compiles the state selector in. Without it the
          # normal game runs and no probe lines can appear
          export HAXEFMOD_TEST_STATE=api-probe
          timeout 180 haxelib run lime test hl -Daudio_test 2>&1 | tee /tmp/lime-test-linux-hl.log || true
          grep -q "API_PROBE: COMPLETE" /tmp/lime-test-linux-hl.log || {
            echo "lime test never reached the probe's COMPLETE line"
            exit 1
          }
          if grep -q "pass=false" /tmp/lime-test-linux-hl.log; then
            echo "lime test run reported failing checks"
            exit 1
          fi
          echo "lime test delivered a working FMOD game end to end"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-linux-hl
          path: |
            /tmp/audio-linux-hl.wav
            /tmp/game-linux-hl.log
            /tmp/volume-test-linux-hl.wav
            /tmp/api-probe-linux-hl.log
            /tmp/cb-test-linux-hl.log
            /tmp/ps-test-linux-hl.log
            /tmp/bank-test-linux-hl.log
            /tmp/pan-test-linux-hl.log
            /tmp/stress-smoke-linux-hl.log
            /tmp/lime-test-linux-hl.log
            /tmp/volume-test-linux-hl.log
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # Linux HashLink Compat Build (FMOD 2.02.33 - version mismatch test)
  # ===========================================================================
  linux-hl-compat:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[linux-hl-compat]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.02.33"
          platform: linux
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg patchelf \
            libpng-dev libturbojpeg0-dev libsdl2-dev libgl1-mesa-dev \
            libopenal-dev libmbedtls-dev libuv1-dev libvorbis-dev libsqlite3-dev libz-dev

      - name: Build and install HashLink
        run: |
          # Pinned to the commit before the SDL3 port (hashlink #830, 2026-06-17).
          # ubuntu-latest has no libsdl3-dev, so newer hashlink master does not build.
          git clone https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink-src
          cd /tmp/hashlink-src
          git checkout 781960a5daca32ad6d5cea87b255fe8b5872551e
          make -j$(nproc) 2>&1 | tee /tmp/hashlink-build.log || {
            echo "=== MAKE FAILED - retrying single-threaded ==="
            make 2>&1 | tee -a /tmp/hashlink-build.log
            exit 1
          }
          sudo make install
          sudo ldconfig
          hl --version || echo "HashLink installed"

      - name: Verify environment
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod check || true

      - name: Build HashLink target (expect version mismatch failure)
        run: |
          cd example-project/EZPlatformer
          set -o pipefail
          if haxelib run lime build hl 2>&1 | tee /tmp/build-mismatch.log; then
            echo "ERROR: the build succeeded despite the SDK version mismatch"
            exit 1
          fi
          grep -q "FMOD SDK version mismatch" /tmp/build-mismatch.log
          echo "Verified: the build failed at compile time with the version mismatch error"

      - name: Test DSP type translation against the 2.02.33 headers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -I "$FMOD_SDK/api/core/inc" \
            -o /tmp/test_dsptype tests/native/test_faxe_dsptype.c
          /tmp/test_dsptype

      - name: Build custom hdll via build-hdll
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod build-hdll
          echo "=== .haxefmod/ contents ==="
          ls -la .haxefmod/
          cat .haxefmod/hlaxe_fmod.version

      - name: Rebuild HashLink target (custom hdll)
        run: |
          rm -rf example-project/EZPlatformer/export/hl
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-custom.log
          grep -q "(custom-compiled from .haxefmod/)" /tmp/build-custom.log
          echo "Verified: custom-compiled hdll from .haxefmod/ was used"

      - name: Patch FMOD libraries
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          patchelf --clear-execstack "$BIN_DIR"/libfmod.so* || true
          patchelf --clear-execstack "$BIN_DIR"/libfmodstudio.so* || true

      - name: Validate build output
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" hl

      - name: Record audio
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1

          # Start PulseAudio with virtual sink
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker

          # Configure ALSA to route through PulseAudio (FMOD uses ALSA by default)
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF

          BIN_DIR="example-project/EZPlatformer/export/hl/bin"

          # Start recording from the virtual sink's monitor
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-linux-hl-compat.wav &
          RECORD_PID=$!

          # Run the game with library paths set
          cd "$BIN_DIR"
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          EXE=$(find . -maxdepth 1 -type f -executable ! -name "*.so*" ! -name "*.hdll" ! -name "run.sh" -print -quit)
          chmod +x "$EXE"
          timeout 30 "$EXE" > /tmp/game-linux-hl-compat.log 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat /tmp/game-linux-hl-compat.log || true
          echo "=== End game log ==="

          wait $RECORD_PID || true

          if [ -f /tmp/audio-linux-hl-compat.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-linux-hl-compat.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-linux-hl-compat.wav 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh /tmp/game-linux-hl-compat.log

      - name: Build volume test
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean hl
          haxelib run lime build hl -Daudio_test

      - name: Record volume test
        run: |
          export DISPLAY=:99

          BIN_DIR="example-project/EZPlatformer/export/hl/bin"

          export FMOD_WAVWRITER=/tmp/volume-test-linux-hl-compat.wav

          cd "$BIN_DIR"
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          EXE=$(find . -maxdepth 1 -type f -executable ! -name "*.so*" ! -name "*.hdll" ! -name "run.sh" -print -quit)
          chmod +x "$EXE"
          "$EXE" > /tmp/volume-test-linux-hl-compat.log 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh /tmp/volume-test-linux-hl-compat.wav 15

      # Validates the binding surface against FMOD 2.02.33. The DSP
      # type translation makes the effect surface version-correct, and
      # the per-effect parameter indexes the probe uses are identical
      # in both versions.
      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: /tmp/api-probe-linux-hl-compat.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-linux-hl-compat
          path: |
            /tmp/audio-linux-hl-compat.wav
            /tmp/game-linux-hl-compat.log
            /tmp/volume-test-linux-hl-compat.wav
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # Linux HTML5 Build + Audio Recording via Browser
  # ===========================================================================
  linux-html5:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[linux-html5]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: html5
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-html5-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg chromium-browser xdotool

      - name: Build HTML5 target
        env:
          FMOD_SDK_WEB: ${{ env.FMOD_SDK }}
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build html5

      - name: Validate FMOD files replaced placeholders
        run: |
          FMOD_JS="example-project/EZPlatformer/export/html5/bin/lib/fmodstudio.js"
          if [ ! -f "$FMOD_JS" ]; then
            echo "FAIL: $FMOD_JS not found"
            exit 1
          fi
          SIZE=$(stat --format=%s "$FMOD_JS")
          if [ "$SIZE" -lt 1000 ]; then
            echo "FAIL: $FMOD_JS is only $SIZE bytes - still a placeholder"
            exit 1
          fi
          echo "OK: fmodstudio.js is $SIZE bytes (real SDK file)"

      - name: Record audio
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1

          # Start PulseAudio with virtual sink
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker

          # Configure ALSA to route through PulseAudio
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF

          # Serve the HTML5 build
          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8080 &
          HTTP_PID=$!
          cd -
          sleep 1

          # Launch Chromium with autoplay enabled
          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --window-size=640,480 \
            --window-position=0,0 \
            http://localhost:8080 &
          CHROME_PID=$!
          sleep 3

          # Click on the browser window to ensure focus
          xdotool mousemove 320 240 click 1
          sleep 1

          # Start recording from the virtual sink's monitor
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-html5.wav &
          RECORD_PID=$!

          sleep 31

          kill $CHROME_PID || true
          kill $HTTP_PID || true
          wait $RECORD_PID || true

          if [ -f /tmp/audio-html5.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-html5.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-html5.wav 10

      - name: Build volume test
        env:
          FMOD_SDK_WEB: ${{ env.FMOD_SDK }}
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean html5
          haxelib run lime build html5 -Daudio_test

      - name: Record volume test
        run: |
          export DISPLAY=:99

          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8081 &
          HTTP_PID=$!
          cd -
          sleep 1

          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            http://localhost:8081 > /tmp/volume-test-html5-console.log 2>&1 &
          CHROME_PID=$!
          sleep 3

          xdotool mousemove 320 240 click 1
          sleep 1

          ffmpeg -f pulse -i virtual_speaker.monitor -t 25 -y /tmp/volume-test-html5.wav &
          RECORD_PID=$!

          sleep 26

          kill $CHROME_PID || true
          kill $HTTP_PID || true
          wait $RECORD_PID || true

          echo "=== Volume test console output ==="
          grep -o "VOLUME_TEST.*" /tmp/volume-test-html5-console.log | sed 's/",.*$//' || true
          echo "=== End volume test console output ==="

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh /tmp/volume-test-html5.wav 15

      - name: Run API probe (JS binding coverage)
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99

          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8082 &
          HTTP_PID=$!
          sleep 1

          # --enable-logging=stderr routes console.log to stderr so the
          # probe results can be captured from the browser
          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8082/index.html?test=api-probe" > /tmp/api-probe-raw.log 2>&1 &
          CHROME_PID=$!
          sleep 3

          xdotool mousemove 320 240 click 1

          # Poll the raw chromium log for the completion gate instead of a
          # fixed sleep - console lines land there continuously, so passing
          # runs finish early and slow runs get up to 45s
          for i in $(seq 45); do
            grep -q "API_PROBE: COMPLETE" /tmp/api-probe-raw.log && break
            sleep 1
          done

          kill $CHROME_PID || true
          kill $HTTP_PID || true

          grep -o "API_PROBE:.*" /tmp/api-probe-raw.log | sed 's/",.*$//' | tee /tmp/api-probe-html5.log
          grep -q "API_PROBE: COMPLETE" /tmp/api-probe-html5.log
          if grep -q "pass=false" /tmp/api-probe-html5.log; then
            echo "FAIL: API probe reported failing checks"
            exit 1
          fi
          echo "API probe passed"

      - name: Run synth test (generated PCM reaches the output)
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99

          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8086 &
          HTTP_PID=$!
          sleep 1

          # Recording starts before the browser so the first tone segment
          # cannot be clipped. The tones run in real time on html5: ~22s of
          # audio after boot.
          ffmpeg -f pulse -i virtual_speaker.monitor -t 45 -y /tmp/synth-test-html5.wav &
          RECORD_PID=$!

          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8086/index.html?test=synth-test" > /tmp/synth-test-raw.log 2>&1 &
          CHROME_PID=$!
          sleep 3

          xdotool mousemove 320 240 click 1

          for i in $(seq 50); do
            grep -q "SYNTH_TEST: COMPLETE" /tmp/synth-test-raw.log && break
            sleep 1
          done
          wait $RECORD_PID || true

          kill $CHROME_PID || true
          kill $HTTP_PID || true

          grep -o "SYNTH_TEST:.*" /tmp/synth-test-raw.log | sed 's/",.*$//' | tee /tmp/synth-test-html5.log
          grep -q "SYNTH_TEST: COMPLETE" /tmp/synth-test-html5.log
          if grep -q "pass=false" /tmp/synth-test-html5.log; then
            echo "FAIL: synth test reported failing checks"
            exit 1
          fi

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh /tmp/synth-test-html5.wav

      - name: Run callback test (JS payload delivery)
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99

          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8083 &
          HTTP_PID=$!
          sleep 1

          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8083/index.html?test=cb-test" > /tmp/cb-test-raw.log 2>&1 &
          CHROME_PID=$!
          sleep 3

          xdotool mousemove 320 240 click 1

          # Poll the raw chromium log for the completion gate instead of a
          # fixed sleep - console lines land there continuously, so passing
          # runs finish early and slow runs get up to 45s
          for i in $(seq 45); do
            grep -q "CB_TEST: COMPLETE" /tmp/cb-test-raw.log && break
            sleep 1
          done

          kill $CHROME_PID || true
          kill $HTTP_PID || true

          grep -o "CB_TEST:.*" /tmp/cb-test-raw.log | sed 's/",.*$//' | tee /tmp/cb-test-html5.log
          grep -q "CB_TEST: Stopped" /tmp/cb-test-html5.log
          grep -q "CB_TEST: COMPLETE" /tmp/cb-test-html5.log
          echo "Callback test passed"

      - name: Run ps-test state (browser)
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99

          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8084 &
          HTTP_PID=$!
          sleep 1

          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8084/index.html?test=ps-test" > /tmp/ps-test-raw.log 2>&1 &
          CHROME_PID=$!
          sleep 3

          xdotool mousemove 320 240 click 1

          # Poll the raw chromium log for the completion gate instead of a
          # fixed sleep - console lines land there continuously, so passing
          # runs finish early and slow runs get up to 45s
          for i in $(seq 45); do
            grep -q "PS_TEST: COMPLETE" /tmp/ps-test-raw.log && break
            sleep 1
          done

          kill $CHROME_PID || true
          kill $HTTP_PID || true

          grep -o "PS_TEST:.*" /tmp/ps-test-raw.log | sed 's/",.*$//' | tee /tmp/ps-test-html5.log
          grep -q "PS_TEST: COMPLETE" /tmp/ps-test-html5.log
          if grep -q "pass=false" /tmp/ps-test-html5.log; then
            echo "FAIL: ps-test reported failing checks"
            exit 1
          fi
          echo "ps-test passed"

      - name: Run bank-test state (browser)
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99

          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8085 &
          HTTP_PID=$!
          sleep 1

          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8085/index.html?test=bank-test" > /tmp/bank-test-raw.log 2>&1 &
          CHROME_PID=$!
          sleep 3

          xdotool mousemove 320 240 click 1

          # Poll the raw chromium log for the completion gate instead of a
          # fixed sleep - console lines land there continuously, so passing
          # runs finish early and slow runs get up to 45s
          for i in $(seq 45); do
            grep -q "BANK_TEST: COMPLETE" /tmp/bank-test-raw.log && break
            sleep 1
          done

          kill $CHROME_PID || true
          kill $HTTP_PID || true

          grep -o "BANK_TEST:.*" /tmp/bank-test-raw.log | sed 's/",.*$//' | tee /tmp/bank-test-html5.log
          grep -q "BANK_TEST: COMPLETE" /tmp/bank-test-html5.log
          if grep -q "pass=false" /tmp/bank-test-html5.log; then
            echo "FAIL: bank-test reported failing checks"
            exit 1
          fi
          echo "bank-test passed"

      - name: Run pan-test state (browser)
        if: ${{ !cancelled() }}
        run: |
          export DISPLAY=:99

          cd example-project/EZPlatformer/export/html5/bin
          python3 -m http.server 8086 &
          HTTP_PID=$!
          sleep 1

          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8086/index.html?test=pan-test" > /tmp/pan-test-raw.log 2>&1 &
          CHROME_PID=$!
          sleep 3

          xdotool mousemove 320 240 click 1

          # Poll the raw chromium log for the completion gate instead of a
          # fixed sleep - console lines land there continuously, so passing
          # runs finish early and slow runs get up to 45s
          for i in $(seq 45); do
            grep -q "PAN_TEST: COMPLETE" /tmp/pan-test-raw.log && break
            sleep 1
          done

          kill $CHROME_PID || true
          kill $HTTP_PID || true

          grep -o "PAN_TEST:.*" /tmp/pan-test-raw.log | sed 's/",.*$//' | tee /tmp/pan-test-html5.log
          grep -q "PAN_TEST: COMPLETE" /tmp/pan-test-html5.log
          if grep -q "pass=false" /tmp/pan-test-html5.log; then
            echo "FAIL: pan-test reported failing checks"
            exit 1
          fi
          echo "pan-test passed"

      # The web-SDK version gate carries this target (the JS shim's
      # numeric tables are version-specific and the wasm exposes no
      # version query): a build against a mismatched FMOD_SDK_WEB has to
      # fail at compile time with the mismatch banner.
      # The FLX_SOUND_SYSTEM-off world of FmodFlxSetup has no other
      # compile coverage (every build keeps the sound system on)
      - name: Typecheck the flixel no-sound-system variant
        if: ${{ !cancelled() }}
        run: |
          haxe -cp . -lib flixel -lib openfl -lib lime \
            -D FLX_NO_SOUND_SYSTEM -D FLX_STANDARD_ASSETS_DIRECTORY -D openfl-html5 \
            --no-output -js /dev/null haxefmod.flixel.FmodFlxSetup

      - name: Verify mismatched web SDK fails the build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          DOCTORED=/tmp/doctored-web-sdk
          rm -rf "$DOCTORED"
          cp -r "$FMOD_SDK" "$DOCTORED"
          sed -i 's/#define FMOD_VERSION    0x[0-9a-fA-F]*/#define FMOD_VERSION    0x00020221/'             "$DOCTORED/api/core/inc/fmod_common.h"
          grep -q "0x00020221" "$DOCTORED/api/core/inc/fmod_common.h" || {
            echo "FAIL: could not doctor the SDK header"; exit 1; }
          cd example-project/EZPlatformer
          haxelib run lime clean html5
          if FMOD_SDK_WEB="$DOCTORED" haxelib run lime build html5 2>&1 | tee /tmp/web-mismatch-build.log; then
            echo "FAIL: build succeeded against a mismatched web SDK"
            exit 1
          fi
          grep -q "FMOD web SDK version mismatch" /tmp/web-mismatch-build.log || {
            echo "FAIL: build failed without the version-mismatch banner"; exit 1; }
          echo "OK: mismatched web SDK fails the build with the banner"

      - name: Upload audio artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-html5
          path: |
            /tmp/audio-html5.wav
            /tmp/volume-test-html5.wav
            /tmp/volume-test-html5-console.log
            /tmp/api-probe-html5.log
            /tmp/cb-test-html5.log
            /tmp/ps-test-html5.log
            /tmp/bank-test-html5.log
            /tmp/pan-test-html5.log
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # macOS C++ Build + Audio Recording
  # ===========================================================================
  mac-cpp:
    runs-on: macos-14
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[mac-cpp]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: mac
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe via Homebrew
        run: |
          # The runner image ships a pre-tapped aws/tap that current
          # Homebrew distrusts. untap it to keep installs warning-free
          brew untap aws/tap 2>/dev/null || true
          brew install haxe neko ffmpeg
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib install hxcpp 4.3.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Cache hxcpp objects
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ runner.os }}-

      - name: Build C++ target
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build mac -64

      - name: Validate build output
        run: |
          APP_BUNDLE=$(find example-project/EZPlatformer/export -name "*.app" -path "*mac*" 2>/dev/null | head -1)
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$APP_BUNDLE/Contents/MacOS" cpp

      - name: Record audio via FMOD wavwriter
        run: |
          echo "Found app: $APP_BUNDLE"

          export FMOD_WAVWRITER=/tmp/audio-mac-cpp.wav

          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/game-mac-cpp.log 2>&1 &
          GAME_PID=$!
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          echo "=== Game log ==="
          cat /tmp/game-mac-cpp.log || true
          echo "=== End game log ==="

          if [ -f /tmp/audio-mac-cpp.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-mac-cpp.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-mac-cpp.wav 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh /tmp/game-mac-cpp.log

      - name: Build volume test
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean mac
          haxelib run lime build mac -64 -Daudio_test

      - name: Record volume test
        run: |
          APP_BUNDLE=$(find example-project/EZPlatformer/export -name "*.app" -path "*mac*" 2>/dev/null | head -1)

          export FMOD_WAVWRITER=/tmp/volume-test-mac-cpp.wav

          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/volume-test-mac-cpp.log 2>&1 &
          GAME_PID=$!
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh /tmp/volume-test-mac-cpp.wav 15

      # The volume rebuild above compiled with -Daudio_test, so the
      # binary can select every test state at runtime
      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/api-probe-mac-cpp.log
          use-wavwriter: "true"

      - name: Run synth-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: synth-test
          gate: SYNTH_TEST
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/synth-test-mac-cpp.log
          use-wavwriter: "true"
          timeout: "60"

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run cb-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: cb-test
          gate: CB_TEST
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/cb-test-mac-cpp.log
          extra-gate: "CB_TEST: Stopped"
          use-wavwriter: "true"

      - name: Run ps-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: ps-test
          gate: PS_TEST
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/ps-test-mac-cpp.log
          copy-jump-wav: "true"
          use-wavwriter: "true"

      - name: Run bank-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: bank-test
          gate: BANK_TEST
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/bank-test-mac-cpp.log
          use-wavwriter: "true"

      - name: Run pan-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: pan-test
          gate: PAN_TEST
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/pan-test-mac-cpp.log
          use-wavwriter: "true"
          timeout: "60"

      # Portability compile of the shared native headers with Apple
      # clang, plus the same sanitizer passes the Linux unit-tests job
      # runs (a second compiler catches what gcc tolerates)
      - name: Test native headers with Apple clang (sanitizers)
        if: ${{ !cancelled() }}
        run: |
          for t in handles cbqueue guid pcmring; do
            clang -std=c99 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Wall -Wextra -Werror -o /tmp/asan_$t tests/native/test_faxe_$t.c
            /tmp/asan_$t
          done
          for t in cbqueue pcmring; do
            clang -std=c99 -pthread -fsanitize=thread -Wall -Wextra -Werror \
              -o /tmp/tsan_$t tests/native/test_faxe_$t.c
            /tmp/tsan_$t
          done
          clang -std=c99 -Wall -Wextra -Werror -I "$FMOD_SDK/api/core/inc" \
            -o /tmp/test_dsptype tests/native/test_faxe_dsptype.c
          /tmp/test_dsptype

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-mac-cpp
          path: |
            /tmp/audio-mac-cpp.wav
            /tmp/game-mac-cpp.log
            /tmp/volume-test-mac-cpp.wav
          if-no-files-found: warn
          overwrite: true

