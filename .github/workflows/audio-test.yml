name: Build and Audio Test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.6
  FMOD_SDK: ${{ github.workspace }}/fmod-sdk

jobs:
  # ===========================================================================
  # Linux C++ Build + Audio Recording
  # ===========================================================================
  linux-cpp:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

  # ===========================================================================
  # Linux HashLink Build + Audio Recording
  # ===========================================================================
  linux-hl:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

  # ===========================================================================
  # Linux HTML5 Build + Audio Recording via Browser
  # ===========================================================================
  linux-html5:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

  # ===========================================================================
  # macOS C++ Build + Audio Recording
  # ===========================================================================
  mac-cpp:
    if: false
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

  # ===========================================================================
  # macOS HashLink Build + Audio Recording
  # ===========================================================================
  mac-hl:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        run: |
          git clone --depth 1 --branch v1 \
            https://x-access-token:${{ secrets.FMOD_SDK_TOKEN }}@github.com/Tanz0rz/fmod-sdk-cache.git \
            "$FMOD_SDK"
          echo "FMOD SDK contents:"
          ls -R "$FMOD_SDK/mac/api/" | head -20

      - name: Setup Haxe via Homebrew
        run: |
          brew install haxe neko hashlink ffmpeg
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Compile hlaxe_fmod.hdll from source
        run: |
          cd native/hlaxe
          make clean
          make

      - name: Compare compiled hdll with pre-built
        run: |
          echo "=== Compiled hdll ==="
          ls -la native/hlaxe/hlaxe_fmod.hdll
          echo "=== Pre-built hdll ==="
          ls -la templates/bin/hl/Mac64/hlaxe_fmod.hdll
          if cmp -s native/hlaxe/hlaxe_fmod.hdll templates/bin/hl/Mac64/hlaxe_fmod.hdll; then
            echo "MATCH: Compiled hdll is identical to pre-built"
          else
            echo "DIFFER: Compiled hdll differs from pre-built"
            echo "This may be expected if the toolchain version differs."
            echo "Compiled:"
            file native/hlaxe/hlaxe_fmod.hdll
            echo "Pre-built:"
            file templates/bin/hl/Mac64/hlaxe_fmod.hdll
          fi

      - name: Build HashLink target
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build hl

      - name: Validate build output
        run: |
          APP_BUNDLE=$(find example-project/EZPlatformer/export/hl -name "*.app" 2>/dev/null | head -1)
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$APP_BUNDLE/Contents/MacOS" hl

      - name: Record audio via FMOD wavwriter
        run: |
          echo "Found app: $APP_BUNDLE"

          # FMOD_WAVWRITER makes FMOD write its mixed output directly to a WAV file.
          # This bypasses CoreAudio entirely - no virtual audio device needed.
          export FMOD_WAVWRITER=/tmp/audio-mac-hl.wav

          # Game auto-quits when player hits the right wall on level 2 (~15s).
          # Timeout at 60s as safety net (macOS lacks GNU timeout).
          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/game-mac-hl.log 2>&1 &
          GAME_PID=$!
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          echo "=== Game log ==="
          cat /tmp/game-mac-hl.log || true
          echo "=== End game log ==="

          if [ -f /tmp/audio-mac-hl.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-mac-hl.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-mac-hl.wav 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh /tmp/game-mac-hl.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-mac-hl
          path: |
            /tmp/audio-mac-hl.wav
            /tmp/game-mac-hl.log
          if-no-files-found: warn

  # ===========================================================================
  # Windows C++ Build + Audio Recording
  # ===========================================================================
  windows-cpp:
    if: false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

  # ===========================================================================
  # Windows HashLink Build + Audio Recording
  # ===========================================================================
  windows-hl:
    if: false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
