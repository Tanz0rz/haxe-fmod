            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true
          grep "STRESS_TEST:" "$LOG" || true
          grep -q "STRESS_TEST: COMPLETE" "$LOG" || { echo "Stress smoke never completed - full log:"; cat "$LOG"; exit 1; }
          if grep -q "pass=false" "$LOG"; then echo "Stress smoke reported failing checks"; exit 1; fi

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-heaps-windows-hl-${{ matrix.state }}
          path: |
            ${{ github.workspace }}/*-heaps-windows-hl.wav
            ${{ github.workspace }}/*-heaps-windows-hl.log
            ${{ github.workspace }}/*-heaps-windows-hl-console.log
          if-no-files-found: ignore
          overwrite: true

