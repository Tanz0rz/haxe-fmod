        uses: actions/upload-artifact@v4
        with:
          name: hlaxe_fmod-windows.hdll
          path: example-project/EZPlatformer/.haxefmod/hlaxe_fmod.hdll

      - name: Validate build output
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" hl

      - name: Record audio via FMOD wavwriter
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo "Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-hl.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-hl.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-hl.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-hl.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-hl.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-hl.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-hl.wav" 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-hl.log"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-windows-hl
          path: |
            audio-windows-hl.wav
            game-windows-hl.log
          if-no-files-found: warn

  # ===========================================================================
  # Windows HashLink Compat Build (FMOD 2.02.33 — version mismatch test)
  # ===========================================================================
  windows-hl-compat:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[windows-hl-compat]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]'))) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        run: |
          git clone --depth 1 --branch 2.02.33 \
            https://x-access-token:${{ secrets.FMOD_SDK_TOKEN }}@github.com/Tanz0rz/fmod-sdk-cache.git \
            /tmp/fmod-sdk-cache
          mkdir -p "$FMOD_SDK"
          cp -R /tmp/fmod-sdk-cache/windows/* "$FMOD_SDK/"
          ls -la "$FMOD_SDK/api/core/inc/" | head -5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Add ffmpeg to PATH
        run: |
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
          for d in /c/ProgramData/chocolatey/lib/ffmpeg/tools/*/bin; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
          done
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          ffprobe -version | head -1 || echo "WARNING: ffprobe not found yet"

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod "$GITHUB_WORKSPACE"
          yes | haxelib run lime setup || true

      - name: Build and install HashLink
        shell: powershell
        run: |
          $HL_URL = "https://github.com/HaxeFoundation/hashlink/releases/download/1.14/hashlink-1.14.0-win.zip"
          Invoke-WebRequest -Uri $HL_URL -OutFile "C:\hashlink.zip"
          Expand-Archive -Path "C:\hashlink.zip" -DestinationPath "C:\"
          $HL_DIR = Get-ChildItem "C:\" -Directory | Where-Object { $_.Name -like "hashlink*" } | Select-Object -First 1
          Rename-Item $HL_DIR.FullName "C:\hashlink"
          echo "C:\hashlink" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "HASHLINK_DIR=C:\hashlink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify environment
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod check || true

      - name: Build HashLink target (expect version mismatch failure)
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-mismatch.log || true
          grep -q "ERROR: FMOD SDK version mismatch" /tmp/build-mismatch.log
          echo "Verified: build failed with version mismatch error"

      - name: Build custom hdll via build-hdll
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd example-project\EZPlatformer
          haxelib run haxefmod build-hdll

      - name: Verify custom hdll created
        run: |
          echo "=== .haxefmod/ contents ==="
          ls -la example-project/EZPlatformer/.haxefmod/
          cat example-project/EZPlatformer/.haxefmod/hlaxe_fmod.version

      - name: Rebuild HashLink target (custom hdll)
        run: |
          rm -rf example-project/EZPlatformer/export/hl
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-custom.log
          grep -q "(custom-compiled from .haxefmod/)" /tmp/build-custom.log
          echo "Verified: custom-compiled hdll from .haxefmod/ was used"

      - name: Validate build output
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" hl

      - name: Record audio via FMOD wavwriter
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo "Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-hl-compat.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-hl-compat.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-hl-compat.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-hl-compat.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-hl-compat.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-hl-compat.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-hl-compat.wav" 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-hl-compat.log"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-windows-hl-compat
          path: |
            audio-windows-hl-compat.wav
            game-windows-hl-compat.log
          if-no-files-found: warn

  # ===========================================================================
  # Update Pre-built hdlls
  # Commits freshly compiled hdlls back to repo if they changed
  # ===========================================================================
  update-hdlls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [linux-hl, mac-hl, windows-hl]
    if: ${{ always() && !cancelled() && needs.linux-hl.result == 'success' && needs.mac-hl.result == 'success' && needs.windows-hl.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure we're on a branch
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Checking out branch: $BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git branch --show-current

      - name: Download compiled hdlls
        uses: actions/download-artifact@v4
        with:
          pattern: hlaxe_fmod-*.hdll
          path: /tmp/hdlls

      - name: Update templates directory
        run: |
          echo "Copying hdlls to templates..."
          cp /tmp/hdlls/hlaxe_fmod-linux.hdll/hlaxe_fmod.hdll templates/bin/hl/Linux64/hlaxe_fmod.hdll
          cp /tmp/hdlls/hlaxe_fmod-mac.hdll/hlaxe_fmod.hdll templates/bin/hl/Mac64/hlaxe_fmod.hdll
          cp /tmp/hdlls/hlaxe_fmod-windows.hdll/hlaxe_fmod.hdll templates/bin/hl/Windows64/hlaxe_fmod.hdll

          echo "Checking for changes..."
          git diff --stat templates/bin/hl/

      - name: Commit updated hdlls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add templates/bin/hl/
          
          if git diff --staged --quiet; then
            echo "No changes to hdlls"
          else
            git commit -m "$(cat <<'COMMIT_MSG'
          Update pre-built hdlls from CI build

          Built against FMOD 2.03.12 from run ${{ github.run_id }}
          COMMIT_MSG
          )"
            git push
          fi
