          use-wavwriter: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-mac-hl
          path: |
            /tmp/audio-mac-hl.wav
            /tmp/game-mac-hl.log
            /tmp/volume-test-mac-hl.wav
            /tmp/api-probe-mac-hl.log
            /tmp/cb-test-mac-hl.log
            /tmp/ps-test-mac-hl.log
            /tmp/bank-test-mac-hl.log
            /tmp/pan-test-mac-hl.log
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # macOS HashLink Compat Build (FMOD 2.02.33 - version mismatch test)
  # ===========================================================================
  mac-hl-compat:
    runs-on: macos-14
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[mac-hl-compat]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.02.33"
          platform: mac
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe via Homebrew
        run: |
          # The runner image ships a pre-tapped aws/tap that current
          # Homebrew distrusts. untap it to keep installs warning-free
          brew untap aws/tap 2>/dev/null || true
          brew install haxe neko hashlink ffmpeg
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Verify environment
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod check || true

      - name: Build HashLink target (expect version mismatch failure)
        run: |
          cd example-project/EZPlatformer
          set -o pipefail
          if haxelib run lime build hl 2>&1 | tee /tmp/build-mismatch.log; then
            echo "ERROR: the build succeeded despite the SDK version mismatch"
            exit 1
          fi
          grep -q "FMOD SDK version mismatch" /tmp/build-mismatch.log
          echo "Verified: the build failed at compile time with the version mismatch error"

      - name: Build custom hdll via build-hdll
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod build-hdll
          echo "=== .haxefmod/ contents ==="
          ls -la .haxefmod/
          cat .haxefmod/hlaxe_fmod.version

      - name: Rebuild HashLink target (custom hdll)
        run: |
          rm -rf example-project/EZPlatformer/export/hl
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-custom.log
          grep -q "(custom-compiled from .haxefmod/)" /tmp/build-custom.log
          echo "Verified: custom-compiled hdll from .haxefmod/ was used"

      - name: Validate build output
        run: |
          APP_BUNDLE=$(find example-project/EZPlatformer/export/hl -name "*.app" 2>/dev/null | head -1)
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$APP_BUNDLE/Contents/MacOS" hl

      - name: Record audio via FMOD wavwriter
        run: |
          echo "Found app: $APP_BUNDLE"

          export FMOD_WAVWRITER=/tmp/audio-mac-hl-compat.wav

          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/game-mac-hl-compat.log 2>&1 &
          GAME_PID=$!
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          echo "=== Game log ==="
          cat /tmp/game-mac-hl-compat.log || true
          echo "=== End game log ==="

          if [ -f /tmp/audio-mac-hl-compat.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-mac-hl-compat.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-mac-hl-compat.wav 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh /tmp/game-mac-hl-compat.log

      - name: Build volume test
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean hl
          haxelib run lime build hl -Daudio_test

      - name: Record volume test
        run: |
          APP_BUNDLE=$(find example-project/EZPlatformer/export/hl -name "*.app" 2>/dev/null | head -1)

          export FMOD_WAVWRITER=/tmp/volume-test-mac-hl-compat.wav

          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/volume-test-mac-hl-compat.log 2>&1 &
          GAME_PID=$!
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh /tmp/volume-test-mac-hl-compat.wav 15

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-mac-hl-compat
          path: |
            /tmp/audio-mac-hl-compat.wav
            /tmp/game-mac-hl-compat.log
            /tmp/volume-test-mac-hl-compat.wav
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # Windows C++ Build + Audio Recording
  # ===========================================================================
  windows-cpp:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[windows-cpp]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: windows
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Add ffmpeg to PATH
        run: |
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
          for d in /c/ProgramData/chocolatey/lib/ffmpeg/tools/*/bin; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
          done
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          ffprobe -version | head -1 || echo "WARNING: ffprobe not found yet"

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib install hxcpp 4.3.2 --always --quiet
          haxelib dev haxefmod "$GITHUB_WORKSPACE"
          yes | haxelib run lime setup || true

      - name: Cache hxcpp objects
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ runner.os }}-

      - name: Build C++ target
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build windows -64

      - name: Validate build output
        run: |
          BIN_DIR=$(find example-project/EZPlatformer/export -type d -name "bin" -path "*windows*" | head -1)
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" cpp

      - name: Record audio via FMOD wavwriter
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo "Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-cpp.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-cpp.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-cpp.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-cpp.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-cpp.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-cpp.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-cpp.wav" 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-cpp.log"

      - name: Build volume test
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean windows
          haxelib run lime build windows -64 -Daudio_test

      - name: Record volume test
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/volume-test-windows-cpp.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/volume-test-windows-cpp.log" 2>&1 || true
          cd -

      - name: Fix volume test WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'volume-test-windows-cpp.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh "$GITHUB_WORKSPACE/volume-test-windows-cpp.wav" 15

      # The volume rebuild above compiled with -Daudio_test, so the
      # binary can select every test state at runtime
      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/api-probe-windows-cpp.log
          use-wavwriter: "true"

      - name: Run synth-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: synth-test
          gate: SYNTH_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/synth-test-windows-cpp.log
          use-wavwriter: "true"
          timeout: "60"

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run cb-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: cb-test
          gate: CB_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/cb-test-windows-cpp.log
          extra-gate: "CB_TEST: Stopped"
          use-wavwriter: "true"

      - name: Run ps-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: ps-test
          gate: PS_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/ps-test-windows-cpp.log
          copy-jump-wav: "true"
          use-wavwriter: "true"

      - name: Run bank-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: bank-test
          gate: BANK_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/bank-test-windows-cpp.log
          use-wavwriter: "true"

      - name: Run pan-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: pan-test
          gate: PAN_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/pan-test-windows-cpp.log
          use-wavwriter: "true"
          timeout: "60"

      # Portability compile of the shared native headers with MSVC in C
      # and C++ modes (the hdll ships MSVC-compiled, so the headers must
      # stay warning-clean there too). vswhere locates VS the same way
      # hxcpp and the doctor do.
      - name: Test native headers with MSVC (C and C++ modes)
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          for %%t in (handles cbqueue guid pcmring) do (
            cl /nologo /W3 /std:c11 /TC /Fe:%TEMP%\msvc_c_%%t.exe tests\native\test_faxe_%%t.c || exit /b 1
            %TEMP%\msvc_c_%%t.exe || exit /b 1
            cl /nologo /W3 /TP /Fe:%TEMP%\msvc_cpp_%%t.exe tests\native\test_faxe_%%t.c || exit /b 1
            %TEMP%\msvc_cpp_%%t.exe || exit /b 1
          )
          cl /nologo /W3 /std:c11 /TC /I "%FMOD_SDK%\api\core\inc" /Fe:%TEMP%\msvc_dsptype.exe tests\native\test_faxe_dsptype.c || exit /b 1
          %TEMP%\msvc_dsptype.exe || exit /b 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-windows-cpp
          path: |
            audio-windows-cpp.wav
            game-windows-cpp.log
            volume-test-windows-cpp.wav
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # Windows HashLink Build + Audio Recording
  # ===========================================================================
  windows-hl:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[windows-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]')))) }}
    timeout-minutes: 30
    defaults:
      run:
