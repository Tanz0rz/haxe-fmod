          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-hl-compat.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-hl-compat.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
