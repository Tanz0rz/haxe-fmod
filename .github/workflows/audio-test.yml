  # ===========================================================================
  # Kha in the browser: khamake build, stage command, WebGL through SwiftShader

  # ===========================================================================
  # Heaps on the HashLink VM, Linux: build once, the states run in parallel in heaps-hl
  # ===========================================================================
  heaps-hl-build:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[heaps-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: linux
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install heaps 2.1.0 --always --quiet
          haxelib install hashlink 1.15.0 --always --quiet
          haxelib install hlsdl 1.15.0 --always --quiet
          haxelib dev haxefmod "$GITHUB_WORKSPACE"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libturbojpeg0-dev libsdl2-dev libgl1-mesa-dev \
            libopenal-dev libmbedtls-dev libuv1-dev libvorbis-dev libsqlite3-dev libz-dev

      - name: Cache the HashLink build
        id: hl-cache
        uses: actions/cache@v5
        with:
          path: /tmp/hashlink-src
          key: hashlink-781960a5-${{ runner.os }}

      - name: Build HashLink
        if: steps.hl-cache.outputs.cache-hit != 'true'
        run: |
          # Same pin as linux-hl: the commit before the SDL3 port
          git clone https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink-src
          cd /tmp/hashlink-src
          git checkout 781960a5daca32ad6d5cea87b255fe8b5872551e
          make -j$(nproc)

      - name: Install HashLink
        run: |
          cd /tmp/hashlink-src
          sudo make install
          sudo ldconfig
          hl --version || echo "HashLink installed"

      - name: Build custom hdll via build-hdll
        run: |
          cd example-project/HeapsPlatformer
          haxelib run haxefmod build-hdll
          cat .haxefmod/hlaxe_fmod.version

      - name: Build test variant
        run: |
          cd example-project/HeapsPlatformer
          # The test variant is the game when no state is requested, so one
          # build serves every leg
          ./build.sh hl -D audio_test > "$RUNNER_TEMP/build-test.log" 2>&1 &
          P2=$!
          wait $P2 || { echo "=== test build failed ==="; cat "$RUNNER_TEMP/build-test.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build-test.log"

      - name: Validate build output
        run: |
          for d in example-project/HeapsPlatformer/build/hl; do
            for f in game.hl run.sh hlaxe_fmod.hdll libfmod.so libfmodstudio.so assets/fmod/Desktop/Master.bank; do
              test -e "$d/$f" || { echo "FAIL: missing $f in $d"; exit 1; }
            done
          done
          echo "OK: build directories are complete"

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: build-heaps-hl
          path: |
            example-project/HeapsPlatformer/build/hl
          include-hidden-files: true
          overwrite: true

  heaps-hl:
    needs: heaps-hl-build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[heaps-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        state: [game-audio, volume, api-probe, synth-test, cb-test, ps-test, bank-test, pan-test, stress-test]
        include:
          - state: api-probe
            gate: API_PROBE
          - state: synth-test
            gate: SYNTH_TEST
          - state: cb-test
            gate: CB_TEST
          - state: ps-test
            gate: PS_TEST
          - state: bank-test
            gate: BANK_TEST
          - state: pan-test
            gate: PAN_TEST
    steps:
      - uses: actions/checkout@v5

      - name: Download build
        uses: actions/download-artifact@v6
        with:
          name: build-heaps-hl
          # A single-path upload drops the directory prefix, a multi-path
          # upload keeps everything below the common ancestor
          path: example-project/HeapsPlatformer/build/hl

      - name: Restore executable bits
        run: |
          # Artifacts do not keep file modes
          cd example-project/HeapsPlatformer
          find build*/hl -maxdepth 1 -type f -exec chmod +x {} +

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg libgl1-mesa-dri libegl1 libgles2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libturbojpeg0-dev libsdl2-dev libgl1-mesa-dev \
            libopenal-dev libmbedtls-dev libuv1-dev libvorbis-dev libsqlite3-dev libz-dev

      - name: Cache the HashLink build
        id: hl-cache
        uses: actions/cache@v5
        with:
          path: /tmp/hashlink-src
          key: hashlink-781960a5-${{ runner.os }}

      - name: Build HashLink
        if: steps.hl-cache.outputs.cache-hit != 'true'
        run: |
          # Same pin as linux-hl: the commit before the SDL3 port
          git clone https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink-src
          cd /tmp/hashlink-src
          git checkout 781960a5daca32ad6d5cea87b255fe8b5872551e
          make -j$(nproc)

      - name: Install HashLink
        run: |
          cd /tmp/hashlink-src
          sudo make install
          sudo ldconfig
          hl --version || echo "HashLink installed"


      - name: Start display and audio
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Record audio
        if: matrix.state == 'game-audio'
        run: |
          export HAXEFMOD_LOG_FILE=/tmp/game-heaps-hl.log
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-heaps-hl.wav &
          RECORD_PID=$!
          cd example-project/HeapsPlatformer/build/hl
          timeout 30 ./run.sh > /tmp/game-heaps-hl.log 2>&1 || true
          cd -
          wait $RECORD_PID || true
          echo "=== Game log ==="
          cat /tmp/game-heaps-hl.log || true
          echo "=== End game log ==="

      - name: Record volume test
        if: matrix.state == 'volume'
        run: |
          export HAXEFMOD_TEST_STATE=volume
          export FMOD_WAVWRITER=/tmp/volume-test-heaps-hl.wav
          export HAXEFMOD_LOG_FILE=/tmp/volume-test-heaps-hl.log
          cd example-project/HeapsPlatformer/build/hl
          ./run.sh > /tmp/volume-test-heaps-hl.log 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate audio
        if: matrix.state == 'game-audio'
        run: ./ci/validate-audio.sh /tmp/audio-heaps-hl.wav 10

      - name: Validate game log
        if: matrix.state == 'game-audio'
        run: ./ci/validate-game-log.sh /tmp/game-heaps-hl.log

      - name: Validate volume/mute
        if: matrix.state == 'volume'
        run: ./ci/validate-volume.sh /tmp/volume-test-heaps-hl.wav 15

      - name: Run state
        if: matrix.gate
        uses: ./.github/actions/run-test-state
        with:
          state: ${{ matrix.state }}
          gate: ${{ matrix.gate }}
          timeout: "60"
          bin-dir: example-project/HeapsPlatformer/build/hl
          log-file: /tmp/${{ matrix.state }}-heaps-hl.log
          extra-gate: "${{ matrix.state == 'cb-test' && 'CB_TEST: Stopped' || '' }}"
          copy-jump-wav: "${{ matrix.state == 'ps-test' && 'true' || 'false' }}"
          use-wavwriter: "${{ matrix.state == 'synth-test' && 'true' || 'false' }}"

      - name: Validate synth audio
        if: matrix.state == 'synth-test'
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run stress-test state (smoke)
        if: matrix.state == 'stress-test'
        run: |
          export HAXEFMOD_TEST_STATE=stress-test
          export STRESS_SECONDS=15
          export FMOD_WAVWRITER="${RUNNER_TEMP}/stress-smoke.wav"
          LOG=/tmp/stress-smoke-heaps-hl.log
          export HAXEFMOD_LOG_FILE="$LOG"
          cd example-project/HeapsPlatformer/build/hl
          ./run.sh > "$LOG" 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 90); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true
          grep "STRESS_TEST:" "$LOG" || true
          grep -q "STRESS_TEST: COMPLETE" "$LOG" || { echo "Stress smoke never completed - full log:"; cat "$LOG"; exit 1; }
          if grep -q "pass=false" "$LOG"; then echo "Stress smoke reported failing checks"; exit 1; fi

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-heaps-hl-${{ matrix.state }}
          path: |
            /tmp/*-heaps-hl.wav
            /tmp/*-heaps-hl.log
            /tmp/*-heaps-hl-console.log
          if-no-files-found: ignore
          overwrite: true

