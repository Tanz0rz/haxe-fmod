          export HAXEFMOD_LOG_FILE="$GITHUB_WORKSPACE/volume-test-heaps-windows-hl.log"
          cd example-project/HeapsPlatformer/build/hl
          timeout 60 ./HeapsPlatformer.exe > "$GITHUB_WORKSPACE/volume-test-heaps-windows-hl.log" 2>&1 || true
