        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: mac
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe via Homebrew
        run: |
          # The runner image ships a pre-tapped aws/tap that current
          # Homebrew distrusts. untap it to keep installs warning-free
          brew untap aws/tap 2>/dev/null || true
          brew install haxe neko hashlink ffmpeg
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Verify environment
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod check || true

      - name: Build HashLink target (pre-built hdll)
        run: |
          # A binding ABI bump lands before update-hdlls can rebuild the
          # shipped hdlls, so a stale marker skips this verification and
          # the fresh hdll from build-hdll carries the rest of the job.
          # update-hdlls refreshes the templates once the HL jobs pass and
          # the next run verifies the pre-built one again.
          ABI=$(grep "^# abi-version:" native/manifest/studio_api.txt | sed 's/.*: *//')
          STALE=0
          for HDLL in templates/bin/hl/*/hlaxe_fmod.hdll; do
            MARK=$(grep -a -o "hlaxe_fmod_abi=[0-9]*" "$HDLL" | head -1 | sed 's/.*=//')
            echo "$HDLL marker abi=$MARK (library abi=$ABI)"
            if [ "$MARK" != "$ABI" ]; then STALE=1; fi
          done
          if [ "$STALE" = "1" ]; then
            echo "Pre-built hdlls are behind the binding ABI, skipping the pre-built build until update-hdlls refreshes them"
            exit 0
          fi
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-prebuilt.log
          grep -q "(pre-built)" /tmp/build-prebuilt.log
          echo "Verified: pre-built hdll was used"

      - name: Build custom hdll via build-hdll
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod build-hdll
          echo "=== .haxefmod/ contents ==="
          ls -la .haxefmod/
          cat .haxefmod/hlaxe_fmod.version

      - name: Rebuild HashLink target (custom hdll)
        run: |
          rm -rf example-project/EZPlatformer/export/hl
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-custom.log
          grep -q "(custom-compiled from .haxefmod/)" /tmp/build-custom.log
          echo "Verified: custom-compiled hdll from .haxefmod/ was used"

      - name: Upload compiled hdll
        uses: actions/upload-artifact@v6
        with:
          name: hlaxe_fmod-mac.hdll
          path: example-project/EZPlatformer/.haxefmod/hlaxe_fmod.hdll
          overwrite: true

      - name: Validate build output
        run: |
          APP_BUNDLE=$(find example-project/EZPlatformer/export/hl -name "*.app" 2>/dev/null | head -1)
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$APP_BUNDLE/Contents/MacOS" hl

      - name: Record audio via FMOD wavwriter
        run: |
          echo "Found app: $APP_BUNDLE"

          export FMOD_WAVWRITER=/tmp/audio-mac-hl.wav

          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/game-mac-hl.log 2>&1 &
          GAME_PID=$!
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          echo "=== Game log ==="
          cat /tmp/game-mac-hl.log || true
          echo "=== End game log ==="

          if [ -f /tmp/audio-mac-hl.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-mac-hl.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: ./ci/validate-audio.sh /tmp/audio-mac-hl.wav 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh /tmp/game-mac-hl.log

      - name: Build volume test
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean hl
          haxelib run lime build hl -Daudio_test

      - name: Record volume test
        run: |
          APP_BUNDLE=$(find example-project/EZPlatformer/export/hl -name "*.app" 2>/dev/null | head -1)

          export FMOD_WAVWRITER=/tmp/volume-test-mac-hl.wav

          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/volume-test-mac-hl.log 2>&1 &
          GAME_PID=$!
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh /tmp/volume-test-mac-hl.wav 15

      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/api-probe-mac-hl.log
          use-wavwriter: "true"

      - name: Run synth-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: synth-test
          gate: SYNTH_TEST
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/synth-test-mac-hl.log
          use-wavwriter: "true"
          timeout: "60"

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run cb-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: cb-test
          gate: CB_TEST
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/cb-test-mac-hl.log
          extra-gate: "CB_TEST: Stopped"
          use-wavwriter: "true"

      - name: Run ps-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: ps-test
          gate: PS_TEST
          timeout: "60"
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/ps-test-mac-hl.log
          copy-jump-wav: "true"
          use-wavwriter: "true"

      - name: Run bank-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: bank-test
          gate: BANK_TEST
          timeout: "60"
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/bank-test-mac-hl.log
          use-wavwriter: "true"

      - name: Run pan-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: pan-test
          gate: PAN_TEST
          timeout: "60"
          bin-dir: ${{ env.APP_BUNDLE }}/Contents/MacOS
          log-file: /tmp/pan-test-mac-hl.log
          use-wavwriter: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-mac-hl
          path: |
            /tmp/audio-mac-hl.wav
            /tmp/game-mac-hl.log
            /tmp/volume-test-mac-hl.wav
            /tmp/api-probe-mac-hl.log
            /tmp/cb-test-mac-hl.log
            /tmp/ps-test-mac-hl.log
            /tmp/bank-test-mac-hl.log
            /tmp/pan-test-mac-hl.log
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # macOS HashLink Compat Build (FMOD 2.02.33 - version mismatch test)
  # ===========================================================================
  mac-hl-compat:
    runs-on: macos-14
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[mac-hl-compat]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Use compat fixture banks
        run: |
          rm -f example-project/EZPlatformer/assets/fmod/Desktop/*.bank
          cp tests/fixtures/compat-banks/*.bank example-project/EZPlatformer/assets/fmod/Desktop/

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.02.33"
          platform: mac
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe via Homebrew
        run: |
          # The runner image ships a pre-tapped aws/tap that current
          # Homebrew distrusts. untap it to keep installs warning-free
          brew untap aws/tap 2>/dev/null || true
          brew install haxe neko hashlink ffmpeg
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Verify environment
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod check || true

      - name: Build HashLink target (expect version mismatch failure)
        run: |
          cd example-project/EZPlatformer
          set -o pipefail
          if haxelib run lime build hl 2>&1 | tee /tmp/build-mismatch.log; then
            echo "ERROR: the build succeeded despite the SDK version mismatch"
            exit 1
          fi
          grep -q "FMOD SDK version mismatch" /tmp/build-mismatch.log
          echo "Verified: the build failed at compile time with the version mismatch error"

      - name: Build custom hdll via build-hdll
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod build-hdll
          echo "=== .haxefmod/ contents ==="
          ls -la .haxefmod/
          cat .haxefmod/hlaxe_fmod.version

      - name: Rebuild HashLink target (custom hdll)
        run: |
          rm -rf example-project/EZPlatformer/export/hl
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-custom.log
          grep -q "(custom-compiled from .haxefmod/)" /tmp/build-custom.log
          echo "Verified: custom-compiled hdll from .haxefmod/ was used"

      - name: Validate build output
