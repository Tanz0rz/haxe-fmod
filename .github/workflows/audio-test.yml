          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-hl-compat.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-hl-compat.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-hl-compat.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-hl-compat.wav" 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-hl-compat.log"

      - name: Build volume test
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean hl
          haxelib run lime build hl -Daudio_test

      - name: Record volume test
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/volume-test-windows-hl-compat.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/volume-test-windows-hl-compat.log" 2>&1 || true
