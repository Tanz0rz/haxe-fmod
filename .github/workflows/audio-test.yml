          ffmpeg -f pulse -i virtual_speaker.monitor -t 25 -y /tmp/volume-test-heaps-html5.wav &
          RECORD_PID=$!
          sleep 4
          xdotool mousemove 320 240 click 1
          sleep 22
          kill $CHROME_PID || true
          pkill -f "$PROFILE" || true
          kill $HTTP_PID || true
          wait $RECORD_PID || true
          grep -o "VOLUME_TEST.*" /tmp/volume-test-heaps-html5-console.log | sed 's/",.*$//' || true

      - name: Validate volume/mute
        if: matrix.state == 'volume'
        run: ./ci/validate-volume.sh /tmp/volume-test-heaps-html5.wav 15

      - name: Run state
        if: matrix.gate
        run: |
          STATE="${{ matrix.state }}"
          GATE="${{ matrix.gate }}"
          RAW=/tmp/$STATE-heaps-html5.log.raw
          LOG=/tmp/$STATE-heaps-html5.log
          cd example-project/HeapsPlatformer/build/html5
          python3 -m http.server 8182 &
          HTTP_PID=$!
          cd -
          sleep 1
          PROFILE=$(mktemp -d)
          if [ "$STATE" = synth-test ]; then
            ffmpeg -f pulse -i virtual_speaker.monitor -t 60 -y /tmp/synth-test-heaps-html5.wav &
            RECORD_PID=$!
          fi
          chromium-browser \
            --no-sandbox --no-first-run --no-default-browser-check --user-data-dir="$PROFILE" \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8182/index.html?test=$STATE" > "$RAW" 2>&1 &
          CHROME_PID=$!
          sleep 3
          xdotool mousemove 320 240 click 1
          sleep 5
          xdotool mousemove 320 240 click 1
          for i in $(seq 70); do
            grep -q "$GATE: COMPLETE" "$RAW" && break
            sleep 1
          done
          [ "$STATE" = synth-test ] && wait $RECORD_PID || true
          kill $CHROME_PID || true
          pkill -f "$PROFILE" || true
          kill $HTTP_PID || true
          grep -v "dbus" "$RAW" | tail -n 15 || true
          grep -o "$GATE:.*" "$RAW" | sed 's/",.*$//' | tee "$LOG"
          grep -q "$GATE: COMPLETE" "$LOG"
          if [ "$STATE" = cb-test ]; then
            # Same gate as the flixel browser step: delivery end to end. The
            # nested-beat check is informational on Chromium.
            grep -q "CB_TEST: Stopped" "$LOG"
          elif grep -q "pass=false" "$LOG"; then
            echo "FAIL: $GATE reported failing checks"
            exit 1
          fi

      - name: Validate synth audio
        if: matrix.state == 'synth-test'
        run: ./ci/validate-synth.sh /tmp/synth-test-heaps-html5.wav

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-heaps-html5-${{ matrix.state }}
          path: |
            /tmp/*-heaps-html5.wav
            /tmp/*-heaps-html5.log
            /tmp/*-heaps-html5-console.log
          if-no-files-found: ignore
          overwrite: true

