  # ===========================================================================
  # jaxe.js wasm harnesses (fast full-surface regression of the JS shim)
  # ===========================================================================
  js-harness:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD html5 SDK
        run: |
