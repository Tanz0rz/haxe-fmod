  windows-cpp:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[windows-cpp]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]'))) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        run: |
          git clone --depth 1 --branch 2.03.12 \
            https://x-access-token:${{ secrets.FMOD_SDK_TOKEN }}@github.com/Tanz0rz/fmod-sdk-cache.git \
            /tmp/fmod-sdk-cache
          mkdir -p "$FMOD_SDK"
          cp -R /tmp/fmod-sdk-cache/windows/* "$FMOD_SDK/"
          ls -la "$FMOD_SDK/api/core/inc/" | head -5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Add ffmpeg to PATH
        run: |
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
          for d in /c/ProgramData/chocolatey/lib/ffmpeg/tools/*/bin; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
          done
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          ffprobe -version | head -1 || echo "WARNING: ffprobe not found yet"

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib install hxcpp 4.3.2 --always --quiet
          haxelib dev haxefmod "$GITHUB_WORKSPACE"
          yes | haxelib run lime setup || true

      - name: Build C++ target
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build windows -64

      - name: Validate build output
        run: |
          BIN_DIR=$(find example-project/EZPlatformer/export -type d -name "bin" -path "*windows*" | head -1)
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" cpp

      - name: Record audio via FMOD wavwriter
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo "Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-cpp.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-cpp.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-cpp.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-cpp.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-cpp.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-cpp.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-cpp.wav" 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-cpp.log"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-windows-cpp
          path: |
            audio-windows-cpp.wav
            game-windows-cpp.log
          if-no-files-found: warn

