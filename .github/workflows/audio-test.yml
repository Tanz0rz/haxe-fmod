  # ===========================================================================
  # Environment doctor: `haxelib run haxefmod check` must diagnose correctly
  # ===========================================================================
  env-doctor:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[skip-build]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: linux
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-doctor-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib install hxcpp 4.3.2 --always --quiet
          haxelib dev haxefmod $GITHUB_WORKSPACE
          yes | haxelib run lime setup || true

      - name: Doctor passes in a configured environment
        env:
          FMOD_SDK_WEB: /tmp/fmod-sdk-cache-2.03.12/html5
        run: |
          # A fully configured environment must pass by exit code AND report
          cd example-project/EZPlatformer
          haxelib run haxefmod check 2>&1 | tee /tmp/doctor-ok.log
          grep -q "All .* checks passed!" /tmp/doctor-ok.log
          if grep -q "\[FAIL\]" /tmp/doctor-ok.log; then
            echo "FAIL: doctor reported failing checks in a configured environment"
            exit 1
          fi
          echo "Doctor reported a fully configured environment"

      - name: Doctor rejects a missing FMOD_SDK (negative test)
        env:
          FMOD_SDK: ""
          FMOD_SDK_WEB: /tmp/fmod-sdk-cache-2.03.12/html5
        run: |
          # This scenario EXPECTS the doctor to fail. Every doctor check is
          # scored against the outcome a missing FMOD_SDK must produce
          # (every other check OK, the FMOD_SDK check FAIL, nonzero exit),
          # so the summary below reads N/N when the doctor behaved correctly.
          cd example-project/EZPlatformer
          if haxelib run haxefmod check > /tmp/doctor-missing.log 2>&1; then
            cat /tmp/doctor-missing.log
            echo "NEGATIVE TEST FAILED: doctor exited 0 without FMOD_SDK"
            exit 1
          fi
          cat /tmp/doctor-missing.log
          echo ""
          total=$(grep -cE "\[(OK|FAIL)\]" /tmp/doctor-missing.log)
          fails=$(grep -c "\[FAIL\]" /tmp/doctor-missing.log)
          if [ "$fails" -ne 1 ] || ! grep -q "\[FAIL\] FMOD_SDK environment variable set" /tmp/doctor-missing.log; then
            echo "NEGATIVE TEST FAILED: expected exactly one failing check (FMOD_SDK), saw $fails"
            exit 1
          fi
          echo "NEGATIVE TEST PASSED: $total/$total check outcomes matched expectations"
          echo "  (FMOD_SDK check failed as intended and the doctor exited nonzero)"

      # Negative-path proof that the compile-time gate blocks REAL lime
      # builds (lime ignores postbuild exit codes, so this macro is the only
      # thing standing between a missing SDK and a soundless game)
      - name: Build blocks without FMOD_SDK (hl)
        env:
          FMOD_SDK: ""
        run: |
          cd example-project/EZPlatformer
          if haxelib run lime build hl > /tmp/blocked-hl.log 2>&1; then
            echo "FAIL: hl build succeeded without FMOD_SDK"
            cat /tmp/blocked-hl.log
            exit 1
          fi
          grep -q "FMOD_SDK is not set" /tmp/blocked-hl.log || {
            echo "FAIL: build failed but not with the setup message"
            cat /tmp/blocked-hl.log
            exit 1
          }
          echo "hl build blocked with setup instructions"

      - name: Build blocks without FMOD_SDK_WEB (html5)
        env:
          FMOD_SDK_WEB: ""
        run: |
          cd example-project/EZPlatformer
          if haxelib run lime build html5 > /tmp/blocked-html5.log 2>&1; then
            echo "FAIL: html5 build succeeded without FMOD_SDK_WEB"
            cat /tmp/blocked-html5.log
            exit 1
          fi
          grep -q "FMOD_SDK_WEB is not set" /tmp/blocked-html5.log || {
            echo "FAIL: build failed but not with the setup message"
            cat /tmp/blocked-html5.log
            exit 1
          }
          echo "html5 build blocked with setup instructions"

      # A set-but-wrong SDK path must fail the same as an unset one. It used
      # to compile fine (HL needs no SDK at compile time), skip the postbuild
      # version gate with a soft warning, and copy nothing - producing builds
      # that only launched when stale libraries sat in export/ from earlier
      # successful builds.
      - name: Build blocks with a bogus FMOD_SDK (hl)
        env:
          FMOD_SDK: /tmp/definitely-not-an-sdk
        run: |
          cd example-project/EZPlatformer
          if haxelib run lime build hl > /tmp/bogus-hl.log 2>&1; then
            echo "FAIL: hl build succeeded with a bogus FMOD_SDK"
            cat /tmp/bogus-hl.log
            exit 1
          fi
          grep -q "does not look like an FMOD Engine SDK" /tmp/bogus-hl.log || {
            echo "FAIL: build failed but not with the bogus-SDK message"
            cat /tmp/bogus-hl.log
            exit 1
          }
          echo "hl build blocked: bogus FMOD_SDK rejected at compile time"

      - name: Postbuild rejects a bogus FMOD_SDK
        env:
          FMOD_SDK: /tmp/definitely-not-an-sdk
        run: |
          cd example-project/EZPlatformer
          if haxelib run haxefmod postbuild linux hl "$GITHUB_WORKSPACE" > /tmp/bogus-postbuild.log 2>&1; then
            echo "FAIL: postbuild exited 0 with a bogus FMOD_SDK"
            cat /tmp/bogus-postbuild.log
            exit 1
          fi
          grep -q "does not point at an FMOD SDK" /tmp/bogus-postbuild.log || {
            echo "FAIL: postbuild failed but not with the bogus-SDK message"
            cat /tmp/bogus-postbuild.log
            exit 1
          }
          echo "postbuild blocked: bogus FMOD_SDK is a hard error"

      - name: Postbuild rejects an SDK missing platform libraries
        env:
          FMOD_SDK: /tmp/incomplete-sdk
        run: |
          mkdir -p /tmp/incomplete-sdk/api/core/inc
          cp "$GITHUB_WORKSPACE/fmod-sdk/api/core/inc/fmod_common.h" /tmp/incomplete-sdk/api/core/inc/
          mkdir -p example-project/EZPlatformer/export/hl/bin
          cd example-project/EZPlatformer
          if haxelib run haxefmod postbuild linux hl "$GITHUB_WORKSPACE" > /tmp/incomplete-postbuild.log 2>&1; then
            echo "FAIL: postbuild exited 0 with the platform libraries missing"
            cat /tmp/incomplete-postbuild.log
            exit 1
          fi
          grep -q "FMOD library directory not found" /tmp/incomplete-postbuild.log || {
            echo "FAIL: postbuild failed but not with the missing-libraries message"
            cat /tmp/incomplete-postbuild.log
            exit 1
          }
          echo "postbuild blocked: incomplete SDK is a hard error"

  # ===========================================================================
  # Package check: the haxelib zip must install and build a project
  # ===========================================================================
  package-check:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[skip-build]') }}
    timeout-minutes: 30
    env:
      FMOD_SDK: ${{ github.workspace }}/fmod-sdk
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches haxelib.json version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION=$(grep '"version"' haxelib.json | sed 's/.*: *"\([^"]*\)".*/\1/')
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "FAIL: tag $TAG does not match haxelib.json version $VERSION"
            exit 1
          fi
          echo "OK: tag $TAG matches haxelib.json version $VERSION"

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: linux
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-package-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Test DSP type translation against this SDK's headers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -I "$FMOD_SDK/api/core/inc" \
            -o /tmp/test_dsptype tests/native/test_faxe_dsptype.c
          /tmp/test_dsptype
          gcc -std=c99 -Wall -Wextra -Werror -I "$FMOD_SDK/api/core/inc" \
            -o /tmp/test_dspdata tests/native/test_faxe_dspdata.c
          /tmp/test_dspdata

      - name: Test the DSP parameter indices against this SDK's headers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -I "$FMOD_SDK/api/core/inc" \
            -o /tmp/test_dspparams tests/native/test_faxe_dspparams.c
          /tmp/test_dspparams
          python3 ci/haxe-enum-values.py --check
          gcc -std=c99 -Wall -Wextra -Werror -I "$FMOD_SDK/api/core/inc" -I "$FMOD_SDK/api/studio/inc" \
            -o /tmp/test_enums tests/native/test_faxe_enums.c
          /tmp/test_enums

      - name: Refuse to package without the pre-built hdlls
        run: |
          # A zip missing an hdll breaks every HashLink install, so the
          # package.sh guard has to hard-fail. Only the script and the
          # templates tree matter: the guard fires before the zip step
          # ever needs the rest of the checkout.
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/repo"
          cp package.sh "$STAGE/repo/"
          cp -r templates "$STAGE/repo/templates"
          rm "$STAGE/repo/templates/bin/hl/Linux64/hlaxe_fmod.hdll"
          if (cd "$STAGE/repo" && ./package.sh); then
            echo "ERROR: package.sh built a zip without the Linux hdll"
            exit 1
          fi
          echo "Verified: package.sh refuses to build without an hdll"
          rm -rf "$STAGE"

      - name: Build the haxelib package
        run: |
          ./package.sh
          echo "=== Package contents (top level) ==="
          unzip -l haxefmod.zip | head -30

          # Files the package must contain: the manifest drives PostBuild's
          # ABI check, the shared headers drive build-hdll, MIGRATION.md is
          # linked from the README, linc_faxe.* is the whole C++ target,
          # the html5 placeholders satisfy lime's parse-time checks, and
          # fmod_expected_version drives the version gate. This job only
          # builds hl and html5, so the C++ files are assert-only here.
          for required in \
            "haxelib.json" \
            "MIGRATION.md" \
            "fmod_expected_version" \
            "native/manifest/studio_api.txt" \
            "native/shared/faxe_handles.h" \
            "native/shared/faxe_cbqueue.h" \
            "native/shared/faxe_guid.h" \
            "native/shared/faxe_instctx.h" \
            "native/shared/faxe_pcmring.h" \
            "native/faxe/linc_faxe.cpp" \
            "native/faxe/linc_faxe.h" \
            "native/faxe/linc_faxe.xml" \
            "native/hlaxe/hlaxe_fmod.c" \
            "native/jaxe/jaxe.js" \
            "native/html5/fmodstudio.js" \
            "native/html5/fmodstudio.wasm" \
            "templates/bin/hl/Linux64/hlaxe_fmod.hdll" \
            "templates/bin/hl/Mac64/hlaxe_fmod.hdll" \
            "templates/bin/hl/Windows64/hlaxe_fmod.hdll" \
            "fmod-scripts/ExportHaxeConstants.js" \
            "README.md" \
            "CHANGELOG.md" \
            "LICENSE" \
            "include.xml"; do
            unzip -Z1 haxefmod.zip | grep -qx "$required" || {
              echo "MISSING from package: $required"
              exit 1
            }
          done
          echo "All required files present"

          # The zip's hdlls must all carry the current ABI marker, not just
          # the Linux one the hl build below happens to scan
          ABI=$(grep -o "abi-version: [0-9]*" native/manifest/studio_api.txt | grep -o "[0-9]*")
          for platform in Linux64 Mac64 Windows64; do
            unzip -p haxefmod.zip "templates/bin/hl/$platform/hlaxe_fmod.hdll" \
              | grep -aq "hlaxe_fmod_abi=$ABI" || {
              echo "FAIL: $platform hdll in the zip lacks the hlaxe_fmod_abi=$ABI marker"
              exit 1
            }
          done
          echo "All packaged hdlls carry ABI marker $ABI"

      # Every tracked file must either be in the zip or sit under a path
      # that is deliberately not shipped, or the packager quietly leaves
      # something users need out of the release.
      - name: Reconcile the package against the tracked tree
        run: |
          set -o pipefail
          git ls-files \
            | grep -vE '^(\.github/|\.gitignore|\.vscode/|ci/|tests/|example-project/|package\.sh|docs/|extension/|logo/|mkdocs\.yml)' \
            | sort > /tmp/tracked-shippable.txt
          unzip -Z1 haxefmod.zip | grep -v '/$' | sort > /tmp/zip-contents.txt
          MISSING=$(comm -23 /tmp/tracked-shippable.txt /tmp/zip-contents.txt)
          if [ -n "$MISSING" ]; then
            echo "Tracked files not in the package (add to package.sh or the exclusion list above):"
            echo "$MISSING"
            exit 1
          fi
          EXTRA=$(comm -13 /tmp/tracked-shippable.txt /tmp/zip-contents.txt)
          if [ -n "$EXTRA" ]; then
            echo "Package contains files git does not track:"
            echo "$EXTRA"
            exit 1
          fi
          echo "Package contents match the tracked tree exactly"

      # The zip verified by every step here is the release artifact: on tag
      # runs it is uploaded so `haxelib submit` ships EXACTLY these bytes
      # instead of a locally rebuilt zip
      - name: Upload the release package
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: haxefmod-release-zip
          path: haxefmod.zip
          if-no-files-found: error

      - name: Install libraries with haxefmod from the package
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          # Install from the zip only, so no checkout copy can leak in
          haxelib remove haxefmod || true
          haxelib install haxefmod.zip --always --quiet
          haxelib path haxefmod
          yes | haxelib run lime setup || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            libpng-dev libturbojpeg0-dev libsdl2-dev libgl1-mesa-dev \
            libopenal-dev libmbedtls-dev libuv1-dev libvorbis-dev libsqlite3-dev libz-dev

      - name: Build and install HashLink
        run: |
          # Pinned to the commit before the SDL3 port (hashlink #830, 2026-06-17).
          # ubuntu-latest has no libsdl3-dev, so newer hashlink master does not build.
          git clone https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink-src
          cd /tmp/hashlink-src
          git checkout 781960a5daca32ad6d5cea87b255fe8b5872551e
          make -j$(nproc) 2>&1 | tee /tmp/hashlink-build.log || {
            echo "=== MAKE FAILED - retrying single-threaded ==="
            make 2>&1 | tee -a /tmp/hashlink-build.log
            exit 1
          }
          sudo make install
          sudo ldconfig
          hl --version || echo "HashLink installed"

      - name: Build HashLink target from the installed package
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/package-build.log
          grep -q "(pre-built)" /tmp/package-build.log
          echo "Verified: pre-built hdll resolved from the installed package"

      - name: Validate build output
        run: |
          ./ci/validate-build.sh example-project/EZPlatformer/export/hl/bin hl

      - name: Build HTML5 target from the installed package
        env:
          FMOD_SDK_WEB: /tmp/fmod-sdk-cache-2.03.12/html5
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build html5

      - name: Validate FMOD files replaced placeholders
        run: |
          FMOD_WASM="example-project/EZPlatformer/export/html5/bin/lib/fmodstudio.wasm"
          if [ ! -f "$FMOD_WASM" ]; then
            echo "FAIL: $FMOD_WASM not found"
            exit 1
          fi
          SIZE=$(stat --format=%s "$FMOD_WASM")
          if [ "$SIZE" -lt 100000 ]; then
            echo "FAIL: $FMOD_WASM is only $SIZE bytes - still a placeholder"
            exit 1
          fi
          echo "OK: fmodstudio.wasm is $SIZE bytes (real SDK file)"

      # The C++ target was previously assert-only from the package (the
      # required-files comment above admitted it) - build it from the
      # installed zip too
      # The check and generate subcommands resolve their files from
      # the installed package layout - exercise them from there, not from
      # the checkout the other jobs use via haxelib dev
      - name: Run CLI commands from the installed package
        run: |
          set -o pipefail
          haxelib run haxefmod check 2>&1 | tee /tmp/pkg-check.log || true
          grep -qiE "haxefmod|fmod" /tmp/pkg-check.log || {
            echo "FAIL: check produced no recognizable output"; exit 1; }
          haxelib run haxefmod generate --strings tests/fixtures/Master.strings.bank \
            --out /tmp/pkg-gen 2>&1 | tee /tmp/pkg-generate.log
          test -f /tmp/pkg-gen/FmodEvents.hx || {
            echo "FAIL: generate from the package produced no constants"; exit 1; }
          echo "CLI commands work from the installed package"


  # ===========================================================================
  # Package Check: C++ target
  # The hxcpp compile dominates package validation, so it runs as its own
  # job on full builds and tag runs only. Solo-tag debug runs skip it.
  # ===========================================================================
  package-check-cpp:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && !contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')) }}
    timeout-minutes: 30
    env:
      FMOD_SDK: ${{ github.workspace }}/fmod-sdk
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: linux
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-package-${{ runner.os }}-${{ env.HAXE_VERSION }}

      # 'pkg' keeps this clear of the platform jobs' 'app' cache: this job
      # builds from the installed haxelib package, and it finishes early
      # enough to claim a shared key before linux-cpp could save its own.
      - name: Cache hxcpp objects
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-${{ runner.os }}-pkg-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ runner.os }}-pkg-

      - name: Build the haxelib package
        run: ./package.sh

      - name: Install libraries with haxefmod from the package
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          # Install from the zip only, so no checkout copy can leak in
          haxelib remove haxefmod || true
          haxelib install haxefmod.zip --always --quiet
          haxelib path haxefmod
          yes | haxelib run lime setup || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpng-dev libturbojpeg0-dev libsdl2-dev libgl1-mesa-dev \
            libopenal-dev libmbedtls-dev libuv1-dev libvorbis-dev libsqlite3-dev libz-dev

      - name: Build C++ target from the installed package
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build linux -64
          ls export/linux*/bin/ | head -5
          echo "C++ build from package OK"

  # ===========================================================================
  # Update Pre-built hdlls
  # Commits freshly compiled hdlls back to repo if they changed
  # ===========================================================================
  update-hdlls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: [linux-hl, mac-hl, windows-hl]
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/heads/') && needs.linux-hl.result == 'success' && needs.mac-hl.result == 'success' && needs.windows-hl.result == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure we're on a branch
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Checking out branch: $BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git branch --show-current

      - name: Download compiled hdlls
        uses: actions/download-artifact@v7
        with:
          pattern: hlaxe_fmod-*.hdll
          path: /tmp/hdlls

      - name: Update templates directory
        run: |
          echo "Copying hdlls to templates..."
          cp /tmp/hdlls/hlaxe_fmod-linux.hdll/hlaxe_fmod.hdll templates/bin/hl/Linux64/hlaxe_fmod.hdll
          cp /tmp/hdlls/hlaxe_fmod-mac.hdll/hlaxe_fmod.hdll templates/bin/hl/Mac64/hlaxe_fmod.hdll
          cp /tmp/hdlls/hlaxe_fmod-windows.hdll/hlaxe_fmod.hdll templates/bin/hl/Windows64/hlaxe_fmod.hdll

          echo "Checking for changes..."
          git diff --stat templates/bin/hl/

      - name: Commit updated hdlls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add templates/bin/hl/
          
          if git diff --staged --quiet; then
            echo "No changes to hdlls"
          else
            git commit -m "$(cat <<'COMMIT_MSG'
          Update pre-built hdlls from CI build [skip-build]

          Built against FMOD 2.03.12 from run ${{ github.run_id }}
          COMMIT_MSG
          )"
            BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
            # Another push may have landed while this workflow ran (e.g. a
            # user commit or a concurrent job). rebase onto the latest remote
            # branch before pushing and retry once if the push still races.
            git pull --rebase origin "$BRANCH_NAME"
            if ! git push; then
              echo "Push rejected, rebasing and retrying once..."
              git pull --rebase origin "$BRANCH_NAME"
              git push
            fi
          fi
