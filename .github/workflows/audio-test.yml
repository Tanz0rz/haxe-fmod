  # ===========================================================================
  # Heaps on the HashLink VM, Windows: build once, the states run in parallel in heaps-windows-hl
  # ===========================================================================
  heaps-windows-hl-build:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[heaps-windows-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: windows
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install heaps 2.1.0 --always --quiet
          haxelib install hashlink 1.15.0 --always --quiet
          haxelib install hlsdl 1.15.0 --always --quiet
          haxelib install hldx 1.15.0 --always --quiet
          haxelib dev haxefmod "$GITHUB_WORKSPACE"

      - name: Install HashLink
        shell: powershell
        run: |
          $HL_URL = "https://github.com/HaxeFoundation/hashlink/releases/download/1.15/hashlink-1.15.0-win.zip"
          Invoke-WebRequest -Uri $HL_URL -OutFile "C:\hashlink.zip"
          Expand-Archive -Path "C:\hashlink.zip" -DestinationPath "C:\"
          $HL_DIR = Get-ChildItem "C:\" -Directory | Where-Object { $_.Name -like "hashlink*" } | Select-Object -First 1
          Rename-Item $HL_DIR.FullName "C:\hashlink"
          echo "C:\hashlink" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "HASHLINK_DIR=C:\hashlink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build custom hdll via build-hdll
        shell: cmd
        run: |
          rem Locate vcvars64.bat via vswhere - the VS version/edition on the
          rem runner image changes over time
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find VC\Auxiliary\Build\vcvars64.bat`) do call "%%i"
          where cl || exit /b 1
          cd example-project\HeapsPlatformer
          haxelib run haxefmod build-hdll

      - name: Build test variant
        run: |
          cd example-project/HeapsPlatformer
          # The test variant is the game when no state is requested, so one
          # build serves every leg
          ./build.sh hl -D audio_test > "$RUNNER_TEMP/build-test.log" 2>&1 &
          P2=$!
          wait $P2 || { echo "=== test build failed ==="; cat "$RUNNER_TEMP/build-test.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build-test.log"

      - name: Validate build output
        run: |
          for d in example-project/HeapsPlatformer/build/hl; do
            for f in HeapsPlatformer.exe hlboot.dat libhl.dll sdl.hdll hlaxe_fmod.hdll fmod.dll fmodstudio.dll assets/fmod/Desktop/Master.bank; do
              test -e "$d/$f" || { echo "FAIL: missing $f in $d"; exit 1; }
            done
          done
          echo "OK: build directories are complete"

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: build-heaps-windows-hl
          path: |
            example-project/HeapsPlatformer/build/hl
          include-hidden-files: true
          overwrite: true

  heaps-windows-hl:
    needs: heaps-windows-hl-build
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[heaps-windows-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        state: [game-audio, volume, api-probe, synth-test, cb-test, ps-test, bank-test, pan-test, stress-test]
        include:
          - state: api-probe
            gate: API_PROBE
          - state: synth-test
            gate: SYNTH_TEST
          - state: cb-test
            gate: CB_TEST
          - state: ps-test
            gate: PS_TEST
          - state: bank-test
            gate: BANK_TEST
          - state: pan-test
            gate: PAN_TEST
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Download build
        uses: actions/download-artifact@v6
        with:
          name: build-heaps-windows-hl
          # A single-path upload drops the directory prefix, a multi-path
          # upload keeps everything below the common ancestor
          path: example-project/HeapsPlatformer/build/hl

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Show the build directory
        run: |
          ls -la example-project/HeapsPlatformer/build/hl
          cd example-project/HeapsPlatformer/build/hl
          timeout 10 ./HeapsPlatformer.exe --version || true
          # HashLink reports a fatal error in a dialog on Windows and the
          # process waits there forever. Read the dialog text, then dismiss
          # it so the process exits and flushes what it printed.
          ./HeapsPlatformer.exe > diag-boot.log 2>&1 &
          DIAG_PID=$!
          sleep 12
          cat > "$RUNNER_TEMP/dialog.ps1" <<'PS'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName System.Windows.Forms
          $procs = Get-Process HeapsPlatformer -ErrorAction SilentlyContinue
          if (-not $procs) { "no HeapsPlatformer process"; exit 0 }
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          foreach ($p in $procs) {
            "process " + $p.Id + " title=[" + $p.MainWindowTitle + "] threads=" + $p.Threads.Count
            $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
            $wins = $root.FindAll([System.Windows.Automation.TreeScope]::Children, $cond)
            foreach ($w in $wins) {
              "window [" + $w.Current.Name + "] class=" + $w.Current.ClassName
              $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { "  UI: [" + $_.Current.Name + "] " + $_.Current.ControlType.ProgrammaticName }
              (New-Object -ComObject WScript.Shell).AppActivate($w.Current.Name) | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            }
          }
          PS
          powershell -NoProfile -ExecutionPolicy Bypass -File "$RUNNER_TEMP/dialog.ps1" || true
          sleep 3
          kill $DIAG_PID 2>/dev/null || true
          wait $DIAG_PID 2>/dev/null || true
          echo "--- first 20 lines of a plain launch:"; head -20 diag-boot.log
          rm -f diag-boot.log

      - name: Record audio
        if: matrix.state == 'game-audio'
        run: |
          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-heaps-windows-hl.wav"
          export HAXEFMOD_LOG_FILE="$GITHUB_WORKSPACE/game-heaps-windows-hl.log"
          cd example-project/HeapsPlatformer/build/hl
          timeout 60 ./HeapsPlatformer.exe > "$GITHUB_WORKSPACE/game-heaps-windows-hl.log" 2>&1 || true
          cd -
