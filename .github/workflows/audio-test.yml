  # ===========================================================================
  # Windows C++ Build + Audio Recording
  # ===========================================================================
  windows-cpp:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[windows-cpp]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: windows
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Add ffmpeg to PATH
        run: |
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
          for d in /c/ProgramData/chocolatey/lib/ffmpeg/tools/*/bin; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
          done
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          ffprobe -version | head -1 || echo "WARNING: ffprobe not found yet"

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib install hxcpp 4.3.2 --always --quiet
          haxelib dev haxefmod "$GITHUB_WORKSPACE"
          yes | haxelib run lime setup || true

      # The cache key carries a flavour ('app'), keeping it clear of the
      # package-check-cpp job's 'pkg' cache. Two jobs on one OS sharing a
      # key means whichever finishes first claims it, and the other then
      # gets a primary-key hit and skips its own save, so it rebuilds from
      # scratch on every run.
      - name: Cache hxcpp objects
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-${{ runner.os }}-app-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ runner.os }}-app-

      - name: Build C++ target
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime build windows -64

      - name: Validate build output
        run: |
          BIN_DIR=$(find example-project/EZPlatformer/export -type d -name "bin" -path "*windows*" | head -1)
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" cpp

      - name: Record audio via FMOD wavwriter
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo "Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-cpp.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-cpp.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-cpp.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-cpp.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-cpp.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-cpp.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-cpp.wav" 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-cpp.log"

      - name: Build volume test
        env:
          HXCPP_COMPILE_CACHE: ${{ runner.temp }}/hxcpp-cache
          HXCPP_CACHE_MB: "4000"
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean windows
          haxelib run lime build windows -64 -Daudio_test

      - name: Record volume test
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/volume-test-windows-cpp.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/volume-test-windows-cpp.log" 2>&1 || true
          cd -

      - name: Fix volume test WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'volume-test-windows-cpp.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh "$GITHUB_WORKSPACE/volume-test-windows-cpp.wav" 15

      # The volume rebuild above compiled with -Daudio_test, so the
      # binary can select every test state at runtime
      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/api-probe-windows-cpp.log
          use-wavwriter: "true"

      - name: Run synth-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: synth-test
          gate: SYNTH_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/synth-test-windows-cpp.log
          use-wavwriter: "true"
          timeout: "60"

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run cb-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: cb-test
          gate: CB_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/cb-test-windows-cpp.log
          extra-gate: "CB_TEST: Stopped"
          use-wavwriter: "true"

      - name: Run ps-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: ps-test
          gate: PS_TEST
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/ps-test-windows-cpp.log
          copy-jump-wav: "true"
          use-wavwriter: "true"

      - name: Run bank-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: bank-test
          gate: BANK_TEST
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/bank-test-windows-cpp.log
          use-wavwriter: "true"

      - name: Run pan-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: pan-test
          gate: PAN_TEST
          bin-dir: example-project/EZPlatformer/export/windows*/bin
          log-file: ${{ github.workspace }}/pan-test-windows-cpp.log
          use-wavwriter: "true"
          timeout: "60"

      # Portability compile of the shared native headers with MSVC in C
      # and C++ modes (the hdll ships MSVC-compiled, so the headers must
      # stay warning-clean there too). vswhere locates VS the same way
      # hxcpp and the doctor do.
      - name: Test native headers with MSVC (C and C++ modes)
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          for %%t in (handles cbqueue guid pcmring) do (
            cl /nologo /W3 /std:c11 /TC /Fe:%TEMP%\msvc_c_%%t.exe tests\native\test_faxe_%%t.c || exit /b 1
            %TEMP%\msvc_c_%%t.exe || exit /b 1
            cl /nologo /W3 /TP /Fe:%TEMP%\msvc_cpp_%%t.exe tests\native\test_faxe_%%t.c || exit /b 1
            %TEMP%\msvc_cpp_%%t.exe || exit /b 1
          )
          cl /nologo /W3 /std:c11 /TC /I "%FMOD_SDK%\api\core\inc" /Fe:%TEMP%\msvc_dsptype.exe tests\native\test_faxe_dsptype.c || exit /b 1
          %TEMP%\msvc_dsptype.exe || exit /b 1
          cl /nologo /W3 /std:c11 /TC /I "%FMOD_SDK%\api\core\inc" /Fe:%TEMP%\msvc_dspdata.exe tests\native\test_faxe_dspdata.c || exit /b 1
          %TEMP%\msvc_dspdata.exe || exit /b 1
          python ci\haxe-enum-values.py --check || exit /b 1
          cl /nologo /W3 /std:c11 /TC /I "%FMOD_SDK%\api\core\inc" /I "%FMOD_SDK%\api\studio\inc" /Fe:%TEMP%\msvc_enums.exe tests\native\test_faxe_enums.c || exit /b 1
          %TEMP%\msvc_enums.exe || exit /b 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-windows-cpp
          path: |
            audio-windows-cpp.wav
            game-windows-cpp.log
            volume-test-windows-cpp.wav
          if-no-files-found: warn
          overwrite: true

  # ===========================================================================
  # Windows HashLink Build + Audio Recording
  # ===========================================================================
  windows-hl:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[windows-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: windows
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Add ffmpeg to PATH
        run: |
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
          for d in /c/ProgramData/chocolatey/lib/ffmpeg/tools/*/bin; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
          done
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          ffprobe -version | head -1 || echo "WARNING: ffprobe not found yet"

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib dev haxefmod "$GITHUB_WORKSPACE"
          yes | haxelib run lime setup || true

      - name: Build and install HashLink
        shell: powershell
        run: |
          $HL_URL = "https://github.com/HaxeFoundation/hashlink/releases/download/1.14/hashlink-1.14.0-win.zip"
          Invoke-WebRequest -Uri $HL_URL -OutFile "C:\hashlink.zip"
          Expand-Archive -Path "C:\hashlink.zip" -DestinationPath "C:\"
          $HL_DIR = Get-ChildItem "C:\" -Directory | Where-Object { $_.Name -like "hashlink*" } | Select-Object -First 1
          Rename-Item $HL_DIR.FullName "C:\hashlink"
          echo "C:\hashlink" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "HASHLINK_DIR=C:\hashlink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify environment
        run: |
          cd example-project/EZPlatformer
          haxelib run haxefmod check || true

      - name: Build HashLink target (pre-built hdll)
        run: |
          # A binding ABI bump lands before update-hdlls can rebuild the
          # shipped hdlls, so a stale marker skips this verification and
          # the fresh hdll from build-hdll carries the rest of the job.
          # update-hdlls refreshes the templates once the HL jobs pass and
          # the next run verifies the pre-built one again.
          ABI=$(grep "^# abi-version:" native/manifest/studio_api.txt | sed 's/.*: *//')
          STALE=0
          for HDLL in templates/bin/hl/*/hlaxe_fmod.hdll; do
            MARK=$(grep -a -o "hlaxe_fmod_abi=[0-9]*" "$HDLL" | head -1 | sed 's/.*=//')
            echo "$HDLL marker abi=$MARK (library abi=$ABI)"
            if [ "$MARK" != "$ABI" ]; then STALE=1; fi
          done
          if [ "$STALE" = "1" ]; then
            echo "Pre-built hdlls are behind the binding ABI, skipping the pre-built build until update-hdlls refreshes them"
            exit 0
          fi
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-prebuilt.log
          grep -q "(pre-built)" /tmp/build-prebuilt.log
          echo "Verified: pre-built hdll was used"

      - name: Build custom hdll via build-hdll
        shell: cmd
        run: |
          rem Locate vcvars64.bat via vswhere - the VS version/edition on the
          rem runner image changes over time (e.g. windows-2025-vs2026).
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find VC\Auxiliary\Build\vcvars64.bat`) do call "%%i"
          where cl || exit /b 1
          cd example-project\EZPlatformer
          haxelib run haxefmod build-hdll

      - name: Verify custom hdll created
        run: |
          echo "=== .haxefmod/ contents ==="
          ls -la example-project/EZPlatformer/.haxefmod/
          cat example-project/EZPlatformer/.haxefmod/hlaxe_fmod.version

      - name: Rebuild HashLink target (custom hdll)
        run: |
          rm -rf example-project/EZPlatformer/export/hl
          cd example-project/EZPlatformer
          haxelib run lime build hl 2>&1 | tee /tmp/build-custom.log
          grep -q "(custom-compiled from .haxefmod/)" /tmp/build-custom.log
          echo "Verified: custom-compiled hdll from .haxefmod/ was used"

      - name: Upload compiled hdll
        uses: actions/upload-artifact@v6
        with:
          name: hlaxe_fmod-windows.hdll
          path: example-project/EZPlatformer/.haxefmod/hlaxe_fmod.hdll
          overwrite: true

      - name: Validate build output
        run: |
          BIN_DIR="example-project/EZPlatformer/export/hl/bin"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ./ci/validate-build.sh "$BIN_DIR" hl

      - name: Record audio via FMOD wavwriter
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo "Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-hl.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-hl.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-hl.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-hl.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-hl.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-hl.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-hl.wav" 10

      - name: Validate game log
        run: ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-hl.log"

      - name: Build volume test
        run: |
          cd example-project/EZPlatformer
          haxelib run lime clean hl
          haxelib run lime build hl -Daudio_test

      - name: Record volume test
        run: |
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/volume-test-windows-hl.wav"

          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/volume-test-windows-hl.log" 2>&1 || true
          cd -

      - name: Fix volume test WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'volume-test-windows-hl.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate volume/mute
        run: ./ci/validate-volume.sh "$GITHUB_WORKSPACE/volume-test-windows-hl.wav" 15

      - name: Run api-probe state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: ${{ github.workspace }}/api-probe-windows-hl.log
          use-wavwriter: "true"

      - name: Run synth-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: synth-test
          gate: SYNTH_TEST
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: ${{ github.workspace }}/synth-test-windows-hl.log
          use-wavwriter: "true"
          timeout: "60"

      - name: Validate synth audio
        if: ${{ !cancelled() }}
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run cb-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: cb-test
          gate: CB_TEST
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: ${{ github.workspace }}/cb-test-windows-hl.log
          extra-gate: "CB_TEST: Stopped"
          use-wavwriter: "true"

      - name: Run ps-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: ps-test
          gate: PS_TEST
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: ${{ github.workspace }}/ps-test-windows-hl.log
          copy-jump-wav: "true"
          use-wavwriter: "true"

      - name: Run bank-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: bank-test
          gate: BANK_TEST
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: ${{ github.workspace }}/bank-test-windows-hl.log
          use-wavwriter: "true"

      - name: Run pan-test state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-state
        with:
          state: pan-test
          gate: PAN_TEST
          timeout: "60"
          bin-dir: example-project/EZPlatformer/export/hl/bin
          log-file: ${{ github.workspace }}/pan-test-windows-hl.log
          use-wavwriter: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-windows-hl
          path: |
            audio-windows-hl.wav
            game-windows-hl.log
            volume-test-windows-hl.wav
            ${{ github.workspace }}/api-probe-windows-hl.log
            ${{ github.workspace }}/cb-test-windows-hl.log
            ${{ github.workspace }}/ps-test-windows-hl.log
            ${{ github.workspace }}/bank-test-windows-hl.log
            ${{ github.workspace }}/pan-test-windows-hl.log
          if-no-files-found: warn
          overwrite: true

