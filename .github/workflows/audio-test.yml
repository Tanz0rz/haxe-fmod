  kha-linux:
    needs: kha-linux-build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[kha-linux]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        state: [game-audio, volume, api-probe, synth-test, cb-test, ps-test, bank-test, pan-test, stress-test, api-probe-manual]
        include:
          - state: api-probe
            gate: API_PROBE
          - state: synth-test
            gate: SYNTH_TEST
          - state: cb-test
            gate: CB_TEST
          - state: ps-test
            gate: PS_TEST
          - state: bank-test
            gate: BANK_TEST
          - state: pan-test
            gate: PAN_TEST
    steps:
      - uses: actions/checkout@v5

      - name: Download build
        uses: actions/download-artifact@v6
        with:
          name: build-kha-linux
          # A single-path upload drops the directory prefix, a multi-path
          # upload keeps everything below the common ancestor
          path: example-project/KhaPlatformer

      - name: Restore executable bits
        run: |
          # Artifacts do not keep file modes
          cd example-project/KhaPlatformer
          find build*/linux -maxdepth 1 -type f -exec chmod +x {} +

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg libgl1-mesa-dri libegl1 libgles2


      - name: Start display and audio
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Record audio
        if: matrix.state == 'game-audio'
        run: |
          export HAXEFMOD_LOG_FILE=/tmp/game-kha-linux.log
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-kha-linux.wav &
          RECORD_PID=$!
          cd example-project/KhaPlatformer/build/linux
          timeout 30 ./run.sh > /tmp/game-kha-linux.log 2>&1 || true
          cd -
          wait $RECORD_PID || true
          echo "=== Game log ==="
          cat /tmp/game-kha-linux.log || true
          echo "=== End game log ==="

      - name: Record volume test
        if: matrix.state == 'volume'
        run: |
          export HAXEFMOD_TEST_STATE=volume
          export FMOD_WAVWRITER=/tmp/volume-test-kha-linux.wav
          export HAXEFMOD_LOG_FILE=/tmp/volume-test-kha-linux.log
          cd example-project/KhaPlatformer/build/linux
          ./run.sh > /tmp/volume-test-kha-linux.log 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate audio
        if: matrix.state == 'game-audio'
        run: ./ci/validate-audio.sh /tmp/audio-kha-linux.wav 10

      - name: Validate game log
        if: matrix.state == 'game-audio'
        run: ./ci/validate-game-log.sh /tmp/game-kha-linux.log

      - name: Validate volume/mute
        if: matrix.state == 'volume'
        run: ./ci/validate-volume.sh /tmp/volume-test-kha-linux.wav 15

      - name: Run state
        if: matrix.gate
        uses: ./.github/actions/run-test-state
        with:
          state: ${{ matrix.state }}
          gate: ${{ matrix.gate }}
          timeout: "60"
          bin-dir: example-project/KhaPlatformer/build/linux
          log-file: /tmp/${{ matrix.state }}-kha-linux.log
          extra-gate: "${{ matrix.state == 'cb-test' && 'CB_TEST: Stopped' || '' }}"
          copy-jump-wav: "${{ matrix.state == 'ps-test' && 'true' || 'false' }}"
          use-wavwriter: "${{ matrix.state == 'synth-test' && 'true' || 'false' }}"

      - name: Validate synth audio
        if: matrix.state == 'synth-test'
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run api-probe state (manual update variant)
        if: matrix.state == 'api-probe-manual'
        uses: ./.github/actions/run-test-state
        with:
          state: api-probe
          gate: API_PROBE
          timeout: "60"
          bin-dir: example-project/KhaPlatformer/build-manual/linux
          log-file: /tmp/api-probe-kha-linux-manual.log

      - name: Run stress-test state (smoke)
        if: matrix.state == 'stress-test'
        run: |
          export HAXEFMOD_TEST_STATE=stress-test
          export STRESS_SECONDS=15
          export FMOD_WAVWRITER="${RUNNER_TEMP}/stress-smoke.wav"
          LOG=/tmp/stress-smoke-kha-linux.log
          export HAXEFMOD_LOG_FILE="$LOG"
          cd example-project/KhaPlatformer/build/linux
          ./run.sh > "$LOG" 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 90); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true
          grep "STRESS_TEST:" "$LOG" || true
          grep -q "STRESS_TEST: COMPLETE" "$LOG" || { echo "Stress smoke never completed - full log:"; cat "$LOG"; exit 1; }
          if grep -q "pass=false" "$LOG"; then echo "Stress smoke reported failing checks"; exit 1; fi

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-kha-linux-${{ matrix.state }}
          path: |
            /tmp/*-kha-linux.wav
            /tmp/*-kha-linux.log
            /tmp/*-kha-linux-console.log
          if-no-files-found: ignore
          overwrite: true

