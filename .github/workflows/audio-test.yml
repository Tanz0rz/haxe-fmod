          GAME_PID=$!
          cd -
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

      - name: Validate audio
        if: matrix.state == 'game-audio'
        run: ./ci/validate-audio.sh /tmp/audio-kha-hl.wav 10

      - name: Validate game log
        if: matrix.state == 'game-audio'
        run: ./ci/validate-game-log.sh /tmp/game-kha-hl.log

      - name: Validate volume/mute
        if: matrix.state == 'volume'
        run: ./ci/validate-volume.sh /tmp/volume-test-kha-hl.wav 15

      - name: Run state
        if: matrix.gate
        uses: ./.github/actions/run-test-state
        with:
          state: ${{ matrix.state }}
          gate: ${{ matrix.gate }}
          timeout: "60"
          bin-dir: example-project/KhaPlatformer/build/linux-hl
          log-file: /tmp/${{ matrix.state }}-kha-hl.log
          extra-gate: "${{ matrix.state == 'cb-test' && 'CB_TEST: Stopped' || '' }}"
          copy-jump-wav: "${{ matrix.state == 'ps-test' && 'true' || 'false' }}"
          use-wavwriter: "${{ matrix.state == 'synth-test' && 'true' || 'false' }}"

      - name: Validate synth audio
        if: matrix.state == 'synth-test'
        run: ./ci/validate-synth.sh "${RUNNER_TEMP}/state-synth-test.wav"

      - name: Run stress-test state (smoke)
        if: matrix.state == 'stress-test'
        run: |
          export HAXEFMOD_TEST_STATE=stress-test
          export STRESS_SECONDS=15
          export FMOD_WAVWRITER="${RUNNER_TEMP}/stress-smoke.wav"
          LOG=/tmp/stress-smoke-kha-hl.log
          export HAXEFMOD_LOG_FILE="$LOG"
          cd example-project/KhaPlatformer/build/linux-hl
          ./run.sh > "$LOG" 2>&1 &
          GAME_PID=$!
          cd -
          for i in $(seq 90); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true
          grep "STRESS_TEST:" "$LOG" || true
          grep -q "STRESS_TEST: COMPLETE" "$LOG" || { echo "Stress smoke never completed - full log:"; cat "$LOG"; exit 1; }
          if grep -q "pass=false" "$LOG"; then echo "Stress smoke reported failing checks"; exit 1; fi

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-kha-hl-${{ matrix.state }}
          path: |
            /tmp/*-kha-hl.wav
            /tmp/*-kha-hl.log
            /tmp/*-kha-hl-console.log
          if-no-files-found: ignore
          overwrite: true

  # ===========================================================================
  # Kha in the browser: build once, the states run in parallel in kha-html5
  # ===========================================================================
  kha-html5-build:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[kha-html5]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Download FMOD SDK
        uses: ./.github/actions/fmod-sdk
        with:
          version: "2.03.12"
          platform: html5
          dest: ${{ env.FMOD_SDK }}
          token: ${{ secrets.FMOD_SDK_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib dev haxefmod "$GITHUB_WORKSPACE"

      - name: Point at the Kha checkout
        run: echo "KHA=$RUNNER_TEMP/Kha" >> "$GITHUB_ENV"

      - name: Cache Kha
        id: kha-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/Kha
          key: kha-${{ runner.os }}-${{ env.KHA_COMMIT }}

      - name: Check out Kha
        if: steps.kha-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/Kode/Kha.git "$RUNNER_TEMP/Kha"
          cd "$RUNNER_TEMP/Kha"
          git checkout "$KHA_COMMIT" 2>/dev/null || true

      - name: Build test variant
        env:
          FMOD_SDK_WEB: ${{ env.FMOD_SDK }}
        run: |
          cd example-project/KhaPlatformer
          # The test variant is the game when no state is requested, so one
          # build serves every leg
          KHA_AUDIO_TEST=1 ./build.sh html5 > "$RUNNER_TEMP/build-test.log" 2>&1 &
          P2=$!
          wait $P2 || { echo "=== test build failed ==="; cat "$RUNNER_TEMP/build-test.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build-test.log"

      - name: Validate build output
        run: |
          for d in example-project/KhaPlatformer/build/html5; do
            for f in index.html kha.js lib/fmodstudio.js lib/fmodstudio.wasm lib/jaxe.js assets/fmod/Desktop/Master.bank; do
              test -e "$d/$f" || { echo "FAIL: missing $f in $d"; exit 1; }
            done
          done
          echo "OK: build directories are complete"

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: build-kha-html5
          path: |
            example-project/KhaPlatformer/build/html5
          include-hidden-files: true
          overwrite: true

  kha-html5:
    needs: kha-html5-build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[kha-html5]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5-chromium]') && !contains(github.event.head_commit.message, '[linux-html5-firefox]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]') && !contains(github.event.head_commit.message, '[linux-hl-compat]') && !contains(github.event.head_commit.message, '[mac-hl-compat]') && !contains(github.event.head_commit.message, '[windows-hl-compat]') && !contains(github.event.head_commit.message, '[heaps-hl]') && !contains(github.event.head_commit.message, '[heaps-html5]') && !contains(github.event.head_commit.message, '[kha-linux]') && !contains(github.event.head_commit.message, '[kha-hl]') && !contains(github.event.head_commit.message, '[kha-html5]') && !contains(github.event.head_commit.message, '[heaps-mac-hl]') && !contains(github.event.head_commit.message, '[heaps-windows-hl]') && !contains(github.event.head_commit.message, '[kha-mac]') && !contains(github.event.head_commit.message, '[kha-mac-hl]') && !contains(github.event.head_commit.message, '[kha-windows]') && !contains(github.event.head_commit.message, '[kha-windows-hl]')))) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        state: [game-audio, volume, api-probe, synth-test, cb-test, ps-test, bank-test, pan-test]
        include:
          - state: api-probe
            gate: API_PROBE
          - state: synth-test
            gate: SYNTH_TEST
          - state: cb-test
            gate: CB_TEST
          - state: ps-test
            gate: PS_TEST
          - state: bank-test
            gate: BANK_TEST
          - state: pan-test
            gate: PAN_TEST
    steps:
      - uses: actions/checkout@v5

      - name: Download build
        uses: actions/download-artifact@v6
        with:
          name: build-kha-html5
          # A single-path upload drops the directory prefix, a multi-path
          # upload keeps everything below the common ancestor
          path: example-project/KhaPlatformer/build/html5

      - name: Restore executable bits
        run: |
          # Artifacts do not keep file modes
          cd example-project/KhaPlatformer
          find build*/html5 -maxdepth 1 -type f -exec chmod +x {} +

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg chromium-browser xdotool


      - name: Start display and audio
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Record audio
        if: matrix.state == 'game-audio'
        run: |
          cd example-project/KhaPlatformer/build/html5
          python3 -m http.server 8180 &
          HTTP_PID=$!
          cd -
          sleep 1
          PROFILE=$(mktemp -d)
          chromium-browser \
            --no-sandbox --no-first-run --no-default-browser-check --user-data-dir="$PROFILE" \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            http://localhost:8180 &
          CHROME_PID=$!
          sleep 3
          xdotool mousemove 320 240 click 1
          sleep 1
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-kha-html5.wav &
          RECORD_PID=$!
          sleep 4
          xdotool mousemove 320 240 click 1
          sleep 27
          kill $CHROME_PID || true
          pkill -f "$PROFILE" || true
          kill $HTTP_PID || true
          wait $RECORD_PID || true

      - name: Validate audio
        if: matrix.state == 'game-audio'
        run: ./ci/validate-audio.sh /tmp/audio-kha-html5.wav 10

      - name: Record volume test
        if: matrix.state == 'volume'
        run: |
          cd example-project/KhaPlatformer/build/html5
          python3 -m http.server 8181 &
          HTTP_PID=$!
          cd -
          sleep 1
          PROFILE=$(mktemp -d)
          chromium-browser \
            --no-sandbox --no-first-run --no-default-browser-check --user-data-dir="$PROFILE" \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8181/index.html?test=volume" > /tmp/volume-test-kha-html5-console.log 2>&1 &
          CHROME_PID=$!
          sleep 3
          xdotool mousemove 320 240 click 1
          sleep 1
          ffmpeg -f pulse -i virtual_speaker.monitor -t 25 -y /tmp/volume-test-kha-html5.wav &
          RECORD_PID=$!
          sleep 4
          xdotool mousemove 320 240 click 1
          sleep 22
          kill $CHROME_PID || true
          pkill -f "$PROFILE" || true
          kill $HTTP_PID || true
          wait $RECORD_PID || true
          grep -o "VOLUME_TEST.*" /tmp/volume-test-kha-html5-console.log | sed 's/",.*$//' || true

      - name: Validate volume/mute
        if: matrix.state == 'volume'
        run: ./ci/validate-volume.sh /tmp/volume-test-kha-html5.wav 15

      - name: Run state
        if: matrix.gate
        run: |
          STATE="${{ matrix.state }}"
          GATE="${{ matrix.gate }}"
          RAW=/tmp/$STATE-kha-html5.log.raw
          LOG=/tmp/$STATE-kha-html5.log
          cd example-project/KhaPlatformer/build/html5
          python3 -m http.server 8182 &
          HTTP_PID=$!
          cd -
          sleep 1
          PROFILE=$(mktemp -d)
          if [ "$STATE" = synth-test ]; then
            ffmpeg -f pulse -i virtual_speaker.monitor -t 60 -y /tmp/synth-test-kha-html5.wav &
            RECORD_PID=$!
          fi
          chromium-browser \
            --no-sandbox --no-first-run --no-default-browser-check --user-data-dir="$PROFILE" \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --autoplay-policy=no-user-gesture-required \
            --enable-logging=stderr --v=0 \
            --window-size=640,480 \
            --window-position=0,0 \
            "http://localhost:8182/index.html?test=$STATE" > "$RAW" 2>&1 &
          CHROME_PID=$!
          sleep 3
          xdotool mousemove 320 240 click 1
          sleep 5
          xdotool mousemove 320 240 click 1
          for i in $(seq 70); do
            grep -q "$GATE: COMPLETE" "$RAW" && break
            sleep 1
          done
          [ "$STATE" = synth-test ] && wait $RECORD_PID || true
          kill $CHROME_PID || true
          pkill -f "$PROFILE" || true
          kill $HTTP_PID || true
          grep -v "dbus" "$RAW" | tail -n 15 || true
          grep -o "$GATE:.*" "$RAW" | sed 's/",.*$//' | tee "$LOG"
          grep -q "$GATE: COMPLETE" "$LOG"
          if [ "$STATE" = cb-test ]; then
            # Same gate as the flixel browser step: delivery end to end. The
            # nested-beat check is informational on Chromium.
            grep -q "CB_TEST: Stopped" "$LOG"
          elif grep -q "pass=false" "$LOG"; then
            echo "FAIL: $GATE reported failing checks"
            exit 1
          fi

      - name: Validate synth audio
        if: matrix.state == 'synth-test'
        run: ./ci/validate-synth.sh /tmp/synth-test-kha-html5.wav

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-kha-html5-${{ matrix.state }}
          path: |
            /tmp/*-kha-html5.wav
            /tmp/*-kha-html5.log
            /tmp/*-kha-html5-console.log
          if-no-files-found: ignore
          overwrite: true

