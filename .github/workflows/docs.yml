name: Docs

# Builds the documentation site (guides from docs/ plus the dox API
# reference under /api/) on every push to the default branch, the 3.0.0
# branch, and release tags, and publishes it to
# https://tanz0rz.com/haxe-fmod/. The site is rsynced from the self-hosted runner
# to the docs host and swapped in atomically. GitHub Pages keeps serving a
# redirect to the new address for old links.

on:
  push:
    branches: [master, 3.0.0]
    tags: ["*"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "haxefmod/**"
      - "ci/check-readme-snippets.py"
      - "ci/docs-root-pages.py"
      - "ci/haxe-bindings.py"
      - "ci/docs-analytics.py"
      - "ci/docs-release-swap.sh"
      - "ci/pages-redirect/**"
      - "overrides/**"
      - "extension/**"
      - "native/**"
      - "LIMITATIONS.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.6

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-docs-${{ runner.os }}-${{ env.HAXE_VERSION }}-flixel-heaps

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install dox --always --quiet
          haxelib install lime 8.3.0 --always --quiet
          haxelib install openfl 9.5.0 --always --quiet
          haxelib install flixel 6.1.2 --always --quiet
          haxelib install heaps 2.1.0 --always --quiet

      - name: Check the generated bindings table and example translations
        run: |
          python3 ci/haxe-bindings.py --check
          python3 ci/haxe-catalog.py --check

      - name: Check every docs-tab entry is reviewed
        run: python3 ci/example-ledger.py --status --require-all

      - name: Compile the guide examples
        run: python3 ci/check-readme-snippets.py docs extension/haxe extension/functions.md

      - name: Drive the extension over the fixture matrix
        run: |
          npm install playwright > /dev/null
          # The runner has chromium's system libraries preinstalled, and
          # --with-deps would need apt and root
          npx playwright install chromium
          node extension/test/run.js --headless --all

      - name: Generate type XML
        run: |
          mkdir -p /tmp/haxefmod-docs
          # One compile typed as an html5 build with every engine library
          # on the path, so the flixel, Heaps, and Kha packages all land
          # in the reference. Kha compiles against the stubs the snippet
          # checker keeps, since Kha only exists as a checkout. The CLI
          # (sys-only) and the native shim package are internal and stay
          # out of the reference.
          python3 ci/check-readme-snippets.py --kha-stubs /tmp/haxefmod-kha-stubs
          haxe -cp . -cp /tmp/haxefmod-kha-stubs \
            -lib flixel -lib openfl -lib lime -lib heaps \
            -D FLX_STANDARD_ASSETS_DIRECTORY -D openfl-html5 -D html5 \
            --no-output -js /dev/null \
            --macro "include('haxefmod', true, ['haxefmod.tools', 'haxefmod.studio.native'])" \
            --xml /tmp/haxefmod-docs/types.xml

      - name: Render the API reference
        run: |
          haxelib run dox -i /tmp/haxefmod-docs -o site-api -in haxefmod --title "haxefmod API reference"
          python3 ci/api-module-pages.py /tmp/haxefmod-docs/types.xml site-api

      - name: Install MkDocs
        # The runner's system Python through a venv: setup-python has no
        # prebuilt interpreters for Debian
        run: |
          python3 -m venv "$RUNNER_TEMP/mkdocs-venv"
          "$RUNNER_TEMP/mkdocs-venv/bin/pip" install --quiet mkdocs-material
          echo "$RUNNER_TEMP/mkdocs-venv/bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: |
          mkdocs build --strict
          rm -rf site/api
          mv site-api site/api
          python3 ci/docs-analytics.py site/api
          python3 ci/check-site-links.py site

      - name: Ship the site to tanz0rz.com
        # The self-hosted runner holds the SSH config and key for the docs
        # host. The release lands under a fresh directory and goes live
        # with one symlink swap.
        env:
          RELEASE: ${{ github.run_id }}-${{ github.run_attempt }}
          SSH_CONFIG: /home/runner/.ssh/tanz0rz_deploy_config
        run: |
          ssh -F "$SSH_CONFIG" deploy-target "mkdir -p /var/www/releases/$RELEASE"
          rsync -az --delete --link-dest=/var/www/tanz0rz/haxe-fmod/ \
            -e "ssh -F $SSH_CONFIG" \
            site/ "deploy-target:/var/www/releases/$RELEASE/haxe-fmod/"
          scp -F "$SSH_CONFIG" ci/docs-release-swap.sh "deploy-target:/var/www/releases/release-swap.sh"
          ssh -F "$SSH_CONFIG" deploy-target "bash /var/www/releases/release-swap.sh /var/www/releases/$RELEASE"
          curl -fsS -o /dev/null https://tanz0rz.com/haxe-fmod/
          curl -fsS -o /dev/null https://tanz0rz.com/haxe-fmod/api/

      - name: Upload the GitHub Pages redirect
        uses: actions/upload-pages-artifact@v4
        with:
          path: ci/pages-redirect

  deploy:
    # Keeps the old GitHub Pages address alive as a redirect to tanz0rz.com
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
