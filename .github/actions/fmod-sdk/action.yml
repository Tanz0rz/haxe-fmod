name: FMOD SDK
description: >
  Provides the FMOD SDK from the Tanz0rz/fmod-sdk-cache repo, restoring it
  from the GitHub Actions cache when possible and cloning the requested tag
  only on a cache miss. Optionally copies one platform subtree into a
  destination directory. The raw clone stays at /tmp/fmod-sdk-cache-<version>
  for jobs that reference it directly.

inputs:
  version:
    description: FMOD SDK version tag in the fmod-sdk-cache repo (e.g. 2.03.12)
    required: true
  platform:
    description: >
      SDK platform subtree to copy (linux, mac, windows, html5), or none to
      keep only the raw clone
    required: true
  dest:
    description: >
      Directory to copy the platform subtree into. When omitted only the raw
      clone at /tmp/fmod-sdk-cache-<version> is provided
    required: false
    default: ""
  token:
    description: Token with read access to the Tanz0rz/fmod-sdk-cache repo
    required: true

runs:
  using: composite
  steps:
    - name: Cache FMOD SDK ${{ inputs.version }}
      uses: actions/cache@v5
      with:
        path: /tmp/fmod-sdk-cache-${{ inputs.version }}
        # Git on Windows checks the SDK's library symlinks out as plain
        # files. An entry a Windows job saved would break the Linux and
        # macOS link steps, so each OS keeps its own entry.
        key: fmod-sdk-${{ runner.os }}-${{ inputs.version }}

    - name: Provide FMOD SDK ${{ inputs.version }}
      shell: bash
      env:
        # The token and the version reach the script through the
        # environment, never through a string the runner pastes into it
        SDK_TOKEN: ${{ inputs.token }}
        SDK_VERSION: ${{ inputs.version }}
      run: |
        case "$SDK_VERSION" in
          *[!0-9.]*|'') echo "fmod-sdk: the version must be digits and dots, got '$SDK_VERSION'"; exit 1 ;;
        esac
        CACHE_DIR="/tmp/fmod-sdk-cache-$SDK_VERSION"
        # actions/cache resolves /tmp against the workspace drive root on
        # Windows, while git-bash mounts /tmp elsewhere. clone to the
        # drive-root path so the post-job cache save sees the same directory
        case "$(uname -s)" in
          MINGW*|MSYS*|CYGWIN*)
            DRIVE=$(pwd -W | cut -c1 | tr '[:upper:]' '[:lower:]')
            CACHE_DIR="/$DRIVE/tmp/fmod-sdk-cache-$SDK_VERSION"
            ;;
        esac
        if [ -z "$(ls -A "$CACHE_DIR" 2>/dev/null)" ]; then
          # The clone lands next to the cache directory and moves in whole,
          # so a cancelled job never caches a partial tree under this key
          rm -rf "$CACHE_DIR.tmp"
          bash "$GITHUB_ACTION_PATH/../../../ci/retry.sh" --clean "$CACHE_DIR.tmp" git clone --depth 1 --branch "$SDK_VERSION" \
            "https://x-access-token:${SDK_TOKEN}@github.com/Tanz0rz/fmod-sdk-cache.git" \
            "$CACHE_DIR.tmp"
          # The clone's origin URL embeds the token. Never persist it (or any
          # git metadata) into the cache archive
          rm -rf "$CACHE_DIR.tmp/.git"
          rm -rf "$CACHE_DIR"
          mv "$CACHE_DIR.tmp" "$CACHE_DIR"
        else
          echo "FMOD SDK $SDK_VERSION restored from the actions cache"
        fi
        if [ "${{ inputs.platform }}" != "none" ] && [ -n "${{ inputs.dest }}" ]; then
          mkdir -p "${{ inputs.dest }}"
          cp -R "$CACHE_DIR/${{ inputs.platform }}"/* "${{ inputs.dest }}/"
          ls "${{ inputs.dest }}/api" | head -5
        fi
