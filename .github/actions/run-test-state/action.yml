name: Run test state
description: >
  Runs one audio_test game state on a native target and gates on its log
  output. The game binary is discovered per platform (run.sh on Linux C++,
  executable scan on Linux HL, the app binary on Mac, the .exe on Windows).

inputs:
  state:
    description: Test state name (HAXEFMOD_TEST_STATE value, e.g. cb-test)
    required: true
  gate:
    description: Log line prefix the state emits (e.g. CB_TEST)
    required: true
  bin-dir:
    description: Directory containing the game executable
    required: true
  log-file:
    description: Path to write the captured game log
    required: true
  extra-gate:
    description: Additional required log line (grepped verbatim), empty to skip
    required: false
    default: ""
  copy-jump-wav:
    description: Copy the example wav into the game assets first (ps-test)
    required: false
    default: "false"
  use-wavwriter:
    description: Route FMOD output to a scratch wav (platforms with no audio device)
    required: false
    default: "false"
  timeout:
    description: Seconds to wait for the state to exit
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.state }}
      shell: bash
      run: |
        # bin-dir can be a glob (linux exports land in linux64/ or linux/).
        # The || true keeps set -e from killing the step when a glob misses.
        BIN_DIR=$(ls -d ${{ inputs.bin-dir }} 2>/dev/null | head -1 || true)
        if [ -z "$BIN_DIR" ]; then
          echo "No bin directory matched: ${{ inputs.bin-dir }}"
          exit 1
        fi
        LOG_FILE="${{ inputs.log-file }}"
        GATE="${{ inputs.gate }}"

        if [ "${{ inputs.copy-jump-wav }}" = "true" ]; then
          # FMOD resolves the path relative to the process cwd: bin-dir on
          # Linux/Windows, but lime Mac apps chdir to Contents/Resources
          mkdir -p "$BIN_DIR/assets/fmod"
          cp example-project/EZPlatformer/fmod/Assets/Jump.wav "$BIN_DIR/assets/fmod/Jump.wav"
          if [ -d "$BIN_DIR/../Resources" ]; then
            mkdir -p "$BIN_DIR/../Resources/assets/fmod"
            cp example-project/EZPlatformer/fmod/Assets/Jump.wav "$BIN_DIR/../Resources/assets/fmod/Jump.wav"
          fi
        fi

        export HAXEFMOD_TEST_STATE="${{ inputs.state }}"
        # GUI executables on Windows have no stdout: the examples mirror
        # their traces into this file
        export HAXEFMOD_LOG_FILE="$LOG_FILE"
        if [ "${{ inputs.use-wavwriter }}" = "true" ]; then
          export FMOD_WAVWRITER="${RUNNER_TEMP}/state-${{ inputs.state }}.wav"
        fi

        cd "$BIN_DIR"
        case "$(uname -s)" in
          Linux*)
            export DISPLAY=:99
            export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
            # The game binary directly. PostBuild's run.sh is only a fallback
            # (on HL builds it can point at hlboot.dat instead of the exe)
            EXE=$(find . -maxdepth 1 -type f -executable ! -name "*.so*" ! -name "*.hdll" ! -name "*.sh" ! -name "*.dat" ! -name "*.hl" ! -name "*.ndll" ! -name "*.bank" -print -quit)
            if [ -z "$EXE" ] && [ -f run.sh ]; then
              EXE=./run.sh
            fi
            ;;
          Darwin*)
            # Executable bit required: the api-probe leaves data files in
            # the bin dir (probe-lastseven.cmd.txt) that would match otherwise
            EXE=$(find . -maxdepth 1 -type f -perm -u+x ! -name "*.dylib" ! -name "*.hdll" ! -name "*.ndll" ! -name "*.so*" ! -name "*.hl" ! -name "run.sh" ! -name "*.bank" -print -quit)
            # A HashLink bytecode build has no executable, only the launcher
            # the stage command wrote
            if [ -z "$EXE" ] && [ -f run.sh ]; then
              EXE=./run.sh
            fi
            ;;
          *)
            EXE=$(find . -maxdepth 1 -name "*.exe" -print -quit)
            if [ -z "$EXE" ] && [ -f run.cmd ]; then
              EXE=./run.cmd
            fi
            ;;
        esac
        # A build that moved or lost its executable is a build failure,
        # reported here instead of as a state that never completed
        [ -n "$EXE" ] || { echo "FAIL: no game executable found in $BIN_DIR"; ls -la; exit 1; }
        echo "Running state ${{ inputs.state }} via $EXE"

        # Runs the game to its exit or the timeout. Returns 0 when the
        # game died on its own within five seconds with no state output.
        # That is a crash at startup rather than a test result.
        run_game() {
          "$EXE" > "$LOG_FILE" 2>&1 &
          GAME_PID=$!
          STARTED=$(date +%s)
          for i in $(seq "${{ inputs.timeout }}"); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          ALIVE=0
          kill -0 $GAME_PID 2>/dev/null && ALIVE=1
          kill $GAME_PID 2>/dev/null || true
          # A game that ignores SIGTERM gets ten seconds, then SIGKILL
          for i in $(seq 10); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          kill -9 $GAME_PID 2>/dev/null || true
          # The Windows launcher is cmd.exe, and a signal to it leaves the
          # game behind. The game is the only hl.exe on the runner.
          case "$EXE" in ./run.cmd) taskkill //F //T //IM hl.exe >/dev/null 2>&1 || true;; esac
          wait $GAME_PID 2>/dev/null || true
          [ "$ALIVE" = 0 ] && [ $(( $(date +%s) - STARTED )) -lt 5 ] && ! grep -q "$GATE:" "$LOG_FILE"
        }
        if run_game; then
          # The window can come up with no size on a fresh runner and
          # the preloader faults before the state starts. One more launch
          # separates that from a real failure.
          echo "The game exited within five seconds with no state output. Launching once more."
          cp "$LOG_FILE" "$(dirname "$LOG_FILE")/first-attempt-$(basename "$LOG_FILE")"
          run_game || true
        fi
        cd - > /dev/null

        grep "$GATE:" "$LOG_FILE" || true
        fail() {
          echo "$1"
          echo "=== Full game log ==="
          cat "$LOG_FILE" || true
          exit 1
        }
        grep -q "$GATE: COMPLETE" "$LOG_FILE" || fail "$GATE never reached COMPLETE"
        if [ -n "${{ inputs.extra-gate }}" ]; then
          grep -q "${{ inputs.extra-gate }}" "$LOG_FILE" || fail "missing required line: ${{ inputs.extra-gate }}"
        fi
        if grep -q "pass=false" "$LOG_FILE"; then
          fail "$GATE reported failing checks"
        fi
        echo "$GATE passed"
