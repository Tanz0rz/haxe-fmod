site_name: haxefmod
site_description: FMOD Studio for Haxe on HTML5, HashLink, Windows, Linux, and macOS
site_url: https://tanz0rz.com/haxe-fmod/
repo_url: https://github.com/Tanz0rz/haxe-fmod
repo_name: Tanz0rz/haxe-fmod
# The docs workflow sets the edit link to the branch it builds from.
# The pencil then points at a branch that has docs/.
edit_uri: !ENV [DOCS_EDIT_URI, "edit/master/docs/"]
docs_dir: docs
site_dir: site
strict: true
validation:
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - content.tabs.link
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# Umami analytics, loaded from the site's own first-party proxy directory
# (overrides/partials/integrations/analytics/custom.html)
# The provider is set by the docs workflow, so a local build carries no
# analytics tag
extra:
  analytics:
    provider: !ENV [DOCS_ANALYTICS, ""]

# Serves LIMITATIONS.md from the repo root inside the site so it appears
# in the nav without a second copy in docs/
hooks:
  - ci/docs-root-pages.py

nav:
  - Welcome: index.md
  - Getting started: getting-started.md
  - FmodManager: guides/fmod-manager.md
  - Generated constants: guides/constants.md
  - Live Update: live-update.md
  - fmod.com extension: guides/extension.md
  - More guides:
      - Handles and results: guides/handles-and-results.md
      - Runtime and settings: guides/settings.md
      - Bank loading: guides/bank-loading.md
      - Callbacks: guides/callbacks.md
      - 3D and listeners: guides/3d.md
      - Core API helpers: guides/core-api.md
      - Engine components: guides/components.md
      - Tools CLI: guides/tools-cli.md
      - Platforms: platforms.md
  - Coverage: coverage.md
  - Limitations: limitations.md
  - API reference: /haxe-fmod/api/
